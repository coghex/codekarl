# Demonstration configuration: `codekarl --config config/demo-callback-error.toml` (build with `--features metal`).
# It reuses the shipped gameplay script; the ui script is scripts/ui/demo_callback_error.lua.

[log]
level = "info"
timestamps = true
colour = "auto"

[window]
backend = "native-metal"

[lua.ui]
entry = "../scripts/ui/demo_callback_error.lua"

[lua.gameplay]
entry = "../scripts/gameplay/main.lua"
