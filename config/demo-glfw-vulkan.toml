# Demonstration configuration: `codekarl --config config/demo-glfw-vulkan.toml` (build with `--features vulkan`).
# It is the shipped ui and gameplay scripts with the GLFW and Vulkan window backend: the window opens in the clear
# colour; Escape or the close button closes it (exit 0); Ctrl-C quits (exit 130); Cmd-Q does nothing; the window
# cannot be resized.

[log]
level = "info"
timestamps = true
colour = "auto"

[window]
backend = "glfw-vulkan"

[lua.ui]
entry = "../scripts/ui/main.lua"

[lua.gameplay]
entry = "../scripts/gameplay/main.lua"
