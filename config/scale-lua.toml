# The milestone 5 scale acceptance's all-quads-moving profile (CK-130, M-lua), run in process by apps/codekarl/tests/scale_lua.rs.
# The harness fills in the two run-specific absolute paths (the placeholders below) and writes the result to a temporary file, so the
# fixtures are always a fresh temporary directory: `@FIXTURES@` is that directory and `@ROOT@` this repository's root. Native Metal, the
# default input bindings (nothing unbound), nearest sampling, a 60 Hz update source, and the `metrics` record shown at `debug`.

[log]
timestamps = false
colour = "never"

[log.categories]
metrics = "debug"
resources = "debug"

[window]
backend = "native-metal"

[render]
filter = "nearest"
assets = "@FIXTURES@"

[frame]
updates_per_second = 60

[lua.ui]
entry = "@ROOT@/scripts/scale/lua_moving.lua"

[lua.gameplay]
entry = "@ROOT@/scripts/gameplay/main.lua"
