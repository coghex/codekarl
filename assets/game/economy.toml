# included (r139). `land_pace_pm` is the share of walking pace on land, and a vehicle with none cannot move on land by itself.
# `water` names the travel profile that moves it on water, and one with none is carried over water. A vehicle with no `carried_*`
# cannot be carried. An input names a `category` (any good that supplies it, the cheapest at the place) or one `good`. `wear` is what
# one 30-day stretch of travel uses up.
[[vehicles]]
id = "hand_cart"
build_hours = 4
hands = 1
inputs = [{ category = "wood", amount = 2 }]
carries_g = 150000
carries_ml = 500000
carried_g = 50000
carried_ml = 600000
crew_full = 1
crew_fewest = 1
land_pace_pm = 1000
wear = { good = "hardwood", units = 1 }

[[vehicles]]
id = "ox_cart"
build_hours = 8
hands = 2
inputs = [{ category = "wood", amount = 4 }]
animals = [{ species = "cattle", count = 1 }]
carries_g = 500000
carries_ml = 1500000
carried_g = 400000
carried_ml = 3000000
crew_full = 2
crew_fewest = 1
land_pace_pm = 800
wear = { good = "hardwood", units = 1 }

