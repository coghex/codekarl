trigger = "happening:inherited_land"
when = { has = ["fennid"] }
chance = 1
effects = [{ remove = "fennid" }]
text = "{name} came into his land and left the fían."

# ======== The yearly check (on the birthday, from age 15) ========

[[event]]
id = "long_strain_melancholy"
trigger = "yearly"
when = { age = [15, 200], over_threshold = true }
chance = 0.005
factors = [{ humour = "black_bile" }, { stress = "cause" }]
effects = [{ raise_grade = "melancholy" }]
text = "Long strain wore {name} down: melancholy ({grade})."

[[event]]
id = "rage_eases"
trigger = "yearly"
when = { has = ["rage_fits"] }
chance = 0.03
factors = [{ humour = "phlegm" }, { virtue = "wrath_patience", per = 0.08 }, { stress = "lift" }]
effects = [{ lower_grade = "rage_fits" }]
text = "Penance and patience cooled {name}'s temper."

[[event]]
id = "madness_from_strain"
trigger = "yearly"
when = { over_threshold_min = 30 }
chance = 0.002
factors = [{ humour = "black_bile" }]
effects = [{ raise_grade = "madness" }]
text = "{name}'s mind broke under the strain ({grade})."

[[event]]
id = "took_to_drink"
trigger = "yearly"
when = { age = [15, 200], lacks = ["drunkard"] }
chance = 0.002
factors = [{ stress = "cause" }, { culture_group = { gaelic = 1.5 } }]
effects = [{ raise_grade = "drunkard" }]
text = "{name} took to drink."

[[event]]
id = "drank_deeper"
trigger = "yearly"
when = { has = ["drunkard"], over_threshold = true }
chance = 0.10
factors = [{ culture_group = { gaelic = 1.25 } }]
effects = [{ raise_grade = "drunkard" }]
text = "{name} drank deeper ({grade})."

[[event]]
id = "drank_less"
trigger = "yearly"
when = { has = ["drunkard"] }
chance = 0.05
factors = [{ stress = "lift" }]
effects = [{ lower_grade = "drunkard" }]
text = "{name} drank less ({grade})."

[[event]]
id = "despair_death"
trigger = "yearly"
when = { has = ["melancholy"] }
chance = 1
factors = [{ grade = "melancholy", by = [0, 0, 0, 0, 0.005, 0.01, 0.02] }, { stress = "cause" }]
effects = [{ die = "despair" }]
text = "{name} died in despair."

# Craft moments (r117, r184): base x (0.1 + skill/20) x pop type. One event per craft; bases are char_gen's at skill 10 / 0.6.
