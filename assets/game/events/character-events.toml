# Character events (draft r1). Drafted by Claude (ck-designer-1), 2026-11-19, for characters slice 4. Notes and approvals:
# .pipeline/coordination/history-scratch/events-data-r1.md. The format is events-r3 (owner r118-r121); the numbers are
# tools/char_gen.py's, tested with the owner r137-r138, and are placeholders to tune.
#
# ---- Format ----
# [[event]]
#   id          unique key
#   trigger     "happening:<name>" (fires when the simulation reports that happening for the character) or "yearly" (the birthday check)
#   when        conditions, all must hold (a table; see the vocabulary)
#   chance      base chance, 0..1, before factors (1 = always)
#   factors     list of multipliers (vocabulary below); the product is applied to the base, the result capped at 1
#   effects     list of effects, applied in order
#   text        the life-log line (player-facing; {name} the character; {trait}, {grade}, {count} where an effect sets them)
#
# Conditions (`when`): age = [min, max]; sex = "m" | "f"; pop_type = [..]; culture_group = [..]; has = [trait or attribute keys];
#   lacks = [..]; skill_min = { skill = n }; virtue_min = { pair = n }; virtue_max = { pair = n }; manner_min / manner_max likewise;
#   over_threshold_min = n (stress - threshold at least n); over_threshold = true (stress above the threshold).
# Factors: { humour = "black_bile" }        1 + 0.15 x (humour - 5), floored at 0.2 (char_gen's hf)
#          { stress = "cause" | "lift" }     cause: x over; lift: / over; over = 1 + max(0, stress - threshold) / 20 (r123)
#          { virtue = "pair", per = k }      1 + k x value (clamped to 0.1 .. 3)
#          { manner = "pair", per = k }      likewise
#          { skill = "s", craft = true }     0.1 + skill / 20 (r184)
#          { pop_type = { noble = 1, ... } } a table by pop type (missing = 0)
#          { culture_group = { gaelic = 1.5 } } a table by culture subgroup (missing = 1)
#          { grade = "trait", by = [.., ..] } by the character's grade of a trait, none..SSS (7 values)
# Effects: { raise_grade = "trait" }  (none -> C, else one up, at most SSS)    { lower_grade = "trait" } (C -> removed)
#          { grant = "attribute" }   (C for a graded one)                         { remove = "attribute" }
#          { count = "counter", add = 1 }                                        { stress = +n | -n }
#          { standing = "fame" | "popularity" | "honour", add = n }              { die = "cause" }
# Deed grades are not events: a deed attribute's grade follows its counter (attributes.toml) the moment the counter changes.
# Removals are not events either: precedence (attributes.toml) removes an attribute the day its conditions fail, with a log line.

# ======== Happenings ========
# The simulation (or, until the war, church and family systems exist, the API) reports these for a character.

[[event]]
id = "birth_of_child_joy"
trigger = "happening:child_born"
when = { has = ["melancholy"] }
chance = 0.25
factors = [{ humour = "blood" }, { stress = "lift" }]
effects = [{ lower_grade = "melancholy" }]
text = "The birth of a child lifted {name}'s spirits."

[[event]]
id = "birth_of_child_log"
trigger = "happening:child_born"
chance = 1
effects = [{ stress = -5 }]
text = "A child was born to {name}."

[[event]]
id = "death_in_family_grief"
trigger = "happening:death_in_family"
chance = 1
effects = [{ stress = 25 }]
text = "{name} mourned a death in the family."

[[event]]
id = "death_in_family_melancholy"
trigger = "happening:death_in_family"
chance = 0.03
factors = [{ humour = "black_bile" }, { stress = "cause" }]
effects = [{ raise_grade = "melancholy" }]
text = "Grief settled on {name}: melancholy ({grade})."

[[event]]
id = "death_in_family_recluse"
trigger = "happening:death_in_family"
chance = 0.03
factors = [{ humour = "phlegm" }, { manner = "solitary_gregarious", per = -0.03 }, { stress = "cause" }]
effects = [{ raise_grade = "recluse" }]
text = "{name} withdrew from company after the loss ({grade})."

[[event]]
id = "marriage"
trigger = "happening:marriage"
chance = 1
effects = [{ stress = -10 }]
text = "{name} married."

[[event]]
id = "marriage_recluse_lift"
trigger = "happening:marriage"
when = { has = ["recluse"] }
chance = 0.25
factors = [{ manner = "solitary_gregarious", per = 0.03 }]
effects = [{ lower_grade = "recluse" }]
text = "Marriage drew {name} back into the world."

[[event]]
id = "coming_of_age"
trigger = "happening:coming_of_age"
chance = 1
effects = []
text = "{name} came of age."

[[event]]
id = "fennid_joins_fian"
trigger = "happening:coming_of_age"
when = { sex = "m", pop_type = ["noble"], culture_group = ["gaelic"] }
chance = 0.6
effects = [{ grant = "fennid" }]
text = "{name} went out with a fían, as young men of his kind did."

[[event]]
id = "battle_survived"
trigger = "happening:battle_survived"
chance = 1
effects = [{ stress = 15 }, { count = "battles_survived", add = 1 }, { standing = "fame", add = 1 }]
text = "{name} fought in a battle and lived."

[[event]]
id = "battle_won_in_command"
trigger = "happening:battle_won_in_command"
chance = 1
effects = [{ count = "campaigns_won", add = 1 }, { standing = "fame", add = 2 }]
text = "{name} led the victors on the field."

[[event]]
id = "defeat_melancholy"
trigger = "happening:defeat"
chance = 0.03
factors = [{ humour = "black_bile" }, { stress = "cause" }]
effects = [{ raise_grade = "melancholy" }]
text = "Defeat left {name} downcast: melancholy ({grade})."

[[event]]
id = "capture"
trigger = "happening:captured"
chance = 1
effects = [{ stress = 30 }]
text = "{name} was taken captive."

[[event]]
id = "capture_melancholy"
trigger = "happening:captured"
chance = 0.03
factors = [{ humour = "black_bile" }, { stress = "cause" }]
effects = [{ raise_grade = "melancholy" }]
text = "Captivity weighed on {name}: melancholy ({grade})."

[[event]]
id = "capture_recluse"
trigger = "happening:captured"
chance = 0.03
factors = [{ humour = "phlegm" }, { manner = "solitary_gregarious", per = -0.03 }, { stress = "cause" }]
effects = [{ raise_grade = "recluse" }]
text = "In captivity {name} turned inward ({grade})."

[[event]]
id = "release"
trigger = "happening:released"
chance = 1
effects = [{ stress = -10 }]
text = "{name} was set free."

[[event]]
