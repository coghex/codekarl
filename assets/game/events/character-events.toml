effects = [{ raise_grade = "rage_fits" }]
text = "The insult left {name} given to fits of rage ({grade})."

[[event]]
id = "exile"
trigger = "happening:exiled"
chance = 1
effects = [{ stress = 25 }, { grant = "exile" }]
text = "{name} went into exile."

[[event]]
id = "exile_melancholy"
trigger = "happening:exiled"
chance = 0.03
factors = [{ humour = "black_bile" }, { stress = "cause" }]
effects = [{ raise_grade = "melancholy" }]
