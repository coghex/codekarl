trigger = "happening:released"
when = { age = [0, 17] }   # a child released from captivity (hostages are the treaty case)
chance = 1
effects = [{ grant = "hostage_raised" }]
text = "{name} came home from a childhood spent as a hostage."

[[event]]
id = "famine"
trigger = "happening:famine"
chance = 1
effects = [{ stress = 10 }]
text = "Hunger came to {name}'s people."

[[event]]
id = "feast"
trigger = "happening:feast"
chance = 1
