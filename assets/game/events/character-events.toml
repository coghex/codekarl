[[event]]
id = "pilgrimage_melancholy_lift"
trigger = "happening:pilgrimage"
when = { has = ["melancholy"] }
chance = 0.25
factors = [{ stress = "lift" }]
effects = [{ lower_grade = "melancholy" }]
