men = [["Alpín", "Alpín"], ["Bridei", "Bridei"], ["Canaul", "Canaul"], ["Ciniod", "Ciniod"], ["Constantín", "Constantín"], ["Drest", "Drest"], ["Elphin", "Elphin"], ["Nechtan", "Nechtan"], ["Óengus", "Óengus"], ["Talorgan", "Talorgan"], ["Uuen", "Uuen"], ["Uurguist", "Uurguist"]]
