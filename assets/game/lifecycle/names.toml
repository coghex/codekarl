# Name pools (draft r1). Drafted by Claude (ck-designer-1), 2026-11-19, for characters slice 5. The owner approves names without
# review (lists/names/irish-768.md). Irish: from irish-768.md (evidence there). The others are drafted from memory as PLACEHOLDERS, to
# check against the sources before they ship widely (in 768 only Mayo's three Northumbrian monks use them).
# men = [[name, genitive]]; the genitive is used for patronymics where the culture uses them.
# patronym: the form of "son of" / "daughter of" + the father's genitive (Irish "mac"/"ingen"); none = no patronymic shown.

[pool.irish]
patronym = { m = "mac", f = "ingen" }
men = [["Áed", "Áeda"], ["Ailill", "Ailello"], ["Anmchad", "Anmchada"], ["Artgal", "Artgaile"], ["Báethgalach", "Báethgalaig"], ["Bran", "Brain"], ["Bressal", "Bressail"], ["Cathal", "Cathail"], ["Cathussach", "Cathussaig"], ["Cellach", "Cellaig"], ["Cerball", "Cerbaill"], ["Coirpre", "Coirpri"], ["Colgu", "Colggen"], ["Colmán", "Colmáin"], ["Conall", "Conaill"], ["Congal", "Congaile"], ["Crimthann", "Crimthainn"], ["Cú Chongalt", "Con Congalt"], ["Cummascach", "Cummascaig"], ["Diarmait", "Diarmata"], ["Domnall", "Domnaill"], ["Donnchad", "Donnchada"], ["Dúnchad", "Dúnchada"], ["Dúnlang", "Dúnlainge"], ["Eochaid", "Echach"], ["Eógan", "Eógain"], ["Eterscél", "Eterscélai"], ["Fáelán", "Fáeláin"], ["Feidlimid", "Feidlimid"], ["Ferchar", "Ferchair"], ["Fergal", "Fergaile"], ["Fiachnae", "Fiachnai"], ["Fingen", "Finguine"], ["Finn", "Finn"], ["Flaithbertach", "Flaithbertaig"], ["Flann", "Flainn"], ["Fogartach", "Fogartaig"], ["Indrechtach", "Indrechtaig"], ["Loingsech", "Loingsig"], ["Máel Dúin", "Máele Dúin"], ["Máel Ruanaid", "Máele Ruanaid"], ["Muiredach", "Muiredaig"], ["Murchad", "Murchada"], ["Niall", "Néill"], ["Óengus", "Óengusa"], ["Sechnasach", "Sechnusaig"], ["Tommaltach", "Tommaltaig"], ["Ultán", "Ultáin"]]
