[namesakes]
# r111: a small chance of a relative's name, else the pool. Sons from the father's side; daughters from the mother's side (proposal,
# open-gaps small item 7). Tried in order; each chance x (1 + relative's importance), importance = 1 for a ruler or title holder,
# 0.5 for a noble house head, 0 otherwise (TUNE). Only a dead relative's name, or the grandfather's, is reused (TUNE).
order = [["father", 0.10], ["grandfather", 0.10], ["uncle", 0.06], ["fathers_friend", 0.04], ["ancestor", 0.05]]
