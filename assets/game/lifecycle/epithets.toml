# Epithets (data r2; r2 2026-11-19: the ten live epithets as structured conditions, for CK-364 5b).
# Conditions use the slice 4 vocabulary (character-events.toml) plus four keys: grade_min = { trait = grade 1..6 };
# stat_max_by_sex = { stat = { m = n, f = n } }; weight_ratio_min = shown weight / rolled weight; count_min = { counter = n }; adult = past
# the age of majority. Tie-break: a new epithet replaces the shown one only if strictly more important (r11); of two gained the same
# day, the one listed first here wins. An epithet once gained is kept (shown or not). From lists/epithets.md (all approved by the owner, 2026-11-14), for characters slice 5. Drafted by Claude
# (ck-designer-1), 2026-11-19. Each: shown (Irish epithets in Irish, the English meaning in the tooltip), importance (a new epithet
# replaces the shown one only if more important), scope, and how it is gained. trigger "later" = its system is not built yet (reigns,
# war, hair colour, the church's acts); the data is kept so it lights up when that system arrives. chance: yearly while the condition
# holds, or on the happening (TUNE; "gained liberally", r11).

[epithet.frossach]
shown = "Frossach ('the Showery')"
importance = 40
scope = "gaelic"
from = "event: portents at birth, then a prosperous reign"
trigger = "later"

