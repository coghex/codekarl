# The palette and base colours of UI kinds (docs/ui-design.md §3.7).
# Palette colours may include alpha; the five colours used for derivation must be opaque.
# Managed kinds keep only non-derived data; custom kinds provide their own outline and hot.

[colour]
body = "#15110a"   # every panel and window body: the map's near-black
text = "#ece3cb"   # text and icons on a body
lock = "#f0a830"
term = "#92ddea"
number = "#5fb35a"
saved = "#5fb35a"
over_limit = "#f66155"
over_limit_dark = "#4b0b06"
dim = "#9a927e"    # subdued ledger column headings
track = "#3a3326"
event_storm = "#6f9fe8"
event_snow = "#dfeaf7"
event_merge = "#8f9fbd"
event_blight = "#b7a23c"
deficit = "#4a7fd6"
surplus = "#d9702b"
band = "#221c13"
pop_peasant = "#c9932e"
pop_monk = "#4fb3c8"
pop_labourer = "#a8261c"
# The character screen (CK-375). Identity colours, not good and bad (docs/ui-design.md §3.7): virtue pink and sin purple (owner r67), and each
# humour in its own (blood red, yellow bile yellow, black bile black, phlegm white; r67, r68). The dark of a portrait cell and an icon tile.
virtue = "#e58bb5"
sin = "#8d55c8"
humour_blood = "#b8322a"
humour_yellow_bile = "#d9b43c"
humour_black_bile = "#000000"
humour_phlegm = "#ece8de"
tile = "#221e1a"
# The graph viewer's series (CK-441): the dataviz reference dark categorical palette, validated on the body colour (see
# .pipeline/coordination/history-graphs/mockups/viewer-provenance-r1.md). Their order is fixed and never re-assigned.
series_1 = "#338ced"
series_2 = "#e76624"
series_3 = "#00a888"
series_4 = "#d28e05"
series_5 = "#e24d8b"
series_6 = "#0aac23"
chip_light = "#d8dce0"        # the light chips of the attributes, and the dark ink on them
chip_light_text = "#2a221a"

[kind_colours]
general = "#6e130f"
location = "#4fb3c8"
social = "#6e130f"
expedition = "#c9932e"

[kind.window]
[kind.time_bar]
speed_box = "#ece3cb"
[kind.places_bar]
[kind.place]
divider = "#c9932e"
[kind.social]
[kind.expedition]
divider = "#c9932e"
[kind.tooltip]
title_text = "#c9932e"
