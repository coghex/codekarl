# The pixel font of the user interface (milestone 7, slice 9), drawn for this project.
#
# Each glyph is a table keyed by its character: `rows` are the glyph's 11 rows ('#' set, '.' clear) and `advance` is how far
# the pen moves, in font pixels. The glyph box is 5 wide and 7 tall from the cap line to the baseline, with two rows above it
# (for the fada accents) and two below (for descenders), so the baseline is at row 9 for every glyph. The digits all have
# the same advance, so a readout whose digits change keeps every later glyph in place. `make_font.py` writes the glyph
# PNGs from this file; this file is the source.

[replacement]
advance = 6
rows = [
    ".....",
    ".....",
    "#####",
    "#...#",
    "#...#",
    "#...#",
    "#...#",
    "#...#",
    "#####",
    ".....",
    ".....",
]

