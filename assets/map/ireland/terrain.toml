# Ireland's terrain types, palette and rules (milestone 6, slice 5). Hand-kept data: the derivation scripts read the keys from here
# and never write this file. The colours are mock-up 2's (docs/map-design.md section 8); the relief and mix values are its rules.
#
# `key` is the colour that stands for the type in terrain.png, so that a hand edit in an image editor is a paint stroke. The keys
# of the land types are their solid colours; sea and lake have keys of their own. fertility is derived by apply_edits.py.

# Under this depth, in metres, the sea dithers towards the shallow-sea tone.
shallow_threshold = 60

# The default look (milestone 9, slice 10a; docs/map-design.md section 12). Fertility sets the share of bright pixels (full colour is 100%
# usable land, the dark colour 0%); hillsides dither against a fixed light; a glacier is ice. `dark_lit` is `dark + 2 x (dark_second - dark)`.
[ice]
colour = "e8e9ed"
second = "b9bcc6"

[look]
# The unit vector towards the light at azimuth 337.5 degrees (x east, y south), as round(10^4 sin a) and round(-10^4 cos a), so that no
# trigonometry runs at load; and the soft curve's constant d0 as a ratio n / d, one value for every zoom step.
light = [-3827, -9239]
d0 = [1, 80]

[water]
sea = "05080e"
shallow_sea = "0b1422"
lake = "0b1422"
river = "3a78c2"


