# waters.toml: the hand-kept list of Ireland's rivers, loughs, sea entries and corrections (CK-350, slice 4 of the rivers design).
#
# Approved by the owner, list by list, in the ck-designer-7 tab (D14): the rivers, their names and tiers (owner-direction-designer-r14.md);
# the sea cells and the hand-drawn last reaches (r15); the loughs, with Lough Allua (r16); the stranded pools (r17, r18); the island sites
# (r19); the reservoirs left out and the corrections (r20); the widths (r21); the Woodford's last reach (r22). Made by ck-designer-7 from the
# import tool's proposal; `import_waters.py build` reads it and writes `rivers.toml` and `water.png` (SOURCES.md, "Water import" and "Ireland's water").
# A comment above a river says what was done to it. No comment: the proposal's river, with a tidied name.

[settings]
a = 2.3
b = 0.4
simplify_m = 8.0
tier_steps = [0, 14, 24]

