[[reservoir]]
name = "Assaroe Lake"
source = "IE_NW_36_717"
reason = "Made by the Erne hydro-electric scheme: the dam at Cathaleen's Fall, built from 1946 to 1955, its turbines commissioned in 1951 and 1952 (Wikipedia, Cathaleen's Fall Hydroelectric Power Station; ESB, Cathleen's Falls). Confidence high."

[[reservoir]]
name = "Ballinrees Reservoir"
source = "Lake_0088"
reason = "An impounding reservoir of NI Water near Coleraine (NI Water's reservoir improvement programme; photographed in 1952, britainfromabove.org.uk XAW045258). The year it was built is not found. Confidence medium."

[[reservoir]]
name = "Ben Crom Reservoir"
source = "Lake_0254"
reason = "Built 1953 to 1957 above the Silent Valley for Belfast's water supply (Wikipedia, Silent Valley Reservoir). Confidence high."

[[reservoir]]
name = "Carrigadrohid Lake"
source = "IE_SW_19_139"
reason = "Made by the ESB's Lee scheme: the dam was built from 1952 to 1957 (Wikipedia, Carrigadrohid hydroelectric power station). Confidence high."

[[reservoir]]
name = "Parteen Basin"
source = "IE_SH_25_191b"
reason = "The basin above Parteen Weir, flooded by the Shannon Scheme, built from 1925 and opened on 22 July 1929 (Wikipedia, Shannon hydroelectric scheme). The survey marks it a heavily modified water body, apart from Lough Derg proper. Confidence high that it is modern; how the river ran here before is not checked."

[[reservoir]]
name = "Inniscarra Lake"
source = "IE_SW_19_138"
reason = "Made by the ESB's Lee scheme: the dam was built from February 1953 and completed in 1957 (Wikipedia, Inniscarra Dam). Confidence high."

[[reservoir]]
name = "Killylane Reservoir"
source = "Lake_0106"
reason = "An impounding reservoir of NI Water (NI Water's reservoir improvement programme; DAERA, Killylane Reservoir). A search summary of Lisburn Today, 'Killylane dam opens at Shane's Hill', gives its opening as June 1964 for the supply of Larne, Ballyclare, Antrim and Ballymena; the page itself could not be opened. Confidence high that it is modern."

[[reservoir]]
name = "Lough Island Reavy"
source = "Lake_0031"
reason = "A man-made reservoir (DAERA, Lough Island Reavy), one of two impoundments of the Bann Reservoir Company, set up by an Act of 1836 (Hansard, Lords, 11 December 1975). Whether a smaller natural lough lay here before is not established. Confidence medium."

[[reservoir]]
name = "Poulaphouca Reservoir"
source = "IE_EA_09_71"
reason = "Made by the ESB's Liffey scheme: created between 1937 and 1947, the flooding beginning on 3 March 1940 (Wikipedia, Poulaphouca Reservoir). Confidence high."

[[reservoir]]
