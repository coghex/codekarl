# CK-181 terrain-edit history (r8) plus CK-234 owner-signed terrain corrections and computed climate/fertility settings (M9).
# r8 = r7 plus two entries at the end, for CK-194 (milestone 7, slice 6): the owner, 2026-11-06, relayed by ck-manager
# (g3wpwaetwu7maemckrwrtycjiw), on the island monasteries of Iniscealtra (Lough Derg) and Inisfallen (Lough Leane): "Make the islands land".
# Each is one cell, the cell containing the named site, painted pasture. They come after every grow and tidy, so no other edit sees
# them. The final settings derive climate, glaciation and fertility after every terrain edit.
# Was: CK-181 medieval pass, edits r7, for assets/map/ireland/edits.toml (2026-11-05). Supersedes r1, the WITHDRAWN r2, r3, r4, both r5 files and r6.
# Author: ck-designer-1, under the owner's delegation of 2026-11-05 and their corrections: "a lot more 'noise' like these bogs were added
# one at a time randomly, little disconnected bits instead of larger 'islands' of usable resources"; "noise shouldnt be used to place
# these, we need to expand existing features in an intelligent way". ck-manager ruling (vzs2e27b): the draft's fbm-placed bog and
# forest are not existing features; clear them; seed bog only from named bogs, the uplands rule and lake edges; forest only from the
# recorded woods and terrain rules; report any shortfall instead of adding seeds.
# Basis of every entry: ck-designer-1 judgement, owner-delegated 2026-11-05. NO noise or random term anywhere.
#
# Format: ck-worker-2's grow format (weawg53k) plus four additions, all deterministic:
#   1. where.relative_elevation_max with where.relative_radius: elevation minus the mean elevation within relative_radius cells
#      (box mean) must be at most this many metres. Basin ground is at or below its local mean.
#   2. grow.max_distance is the straight-line (Euclidean) distance in cells to the seed cell the growth front came from, so growth makes
#      rounded spreads following the ground, not squares.
#   3. tidy = { min_cells, back }: patches of `paint` under min_cells become `back`; patches of `back` under min_cells that are entirely
#      enclosed by `paint` become `paint`. Use terrain_min_patch if it does exactly this, at these points in the order.
#   4. [settings.climate] and [settings.fertility] hold the normative computed-layer values.
# A plain edit (no grow) paints every cell of the region that passes `where`: that is how terrain-rule seeds are laid.
# The reclamation, Lough Neagh and callows entries retain their signed terrain intent.
#
# Owner decisions 2026-11-05 (relayed verbatim by ck-manager, ujpdcqkm): "66 is arbitrary target requirement, we dont need to strictly
# adhere to it. if there are named bogs/woods then they should be included ... as for the usable land hugging rivers, i think that's
# fairly realistic, we dont want each area of land to have the same amount of usable land, some areas are naturally more valuable and
# that is something we want to represent".
# r6 = r4 plus: the eleven wood edits before all bog edits with slope_min 0.01 (ck-manager ruling i9jc48iu), and the 18 named western
# blanket-bog sites (western-bog-sites-r1.md) as further seed_points. Fertility now follows the signed climate and valley formula.
# The western `share = 0.66` is only an upper cap on growth, not a target; growth there is bounded by the
# 10 km max_distance from named places.
# r7 changes from r6 (ck-worker-2's check of the 63 named sites, named-sites-check-r6.md: 14 had no cell of their terrain; the owner:
# "if there are named bogs/woods then they should be included"):
#   - grow.seed_radius = 2 with grow.seed_over: the cells within 2 cells (5 x 5) of each seed point whose terrain is in seed_over become
#     `paint`, whatever `where` says; growth then proceeds from all seeds under `where` as before. Bog: seed_over = pasture, forest, marsh.
#     Woods: pasture.
#   - tidy.keep_seed_points = true: tidy never removes a patch that contains, or touches within one cell, a seed point of an edit with
#     the same paint (a coastal site's 5 x 5 patch can be under min_cells).
#   - wood-kilultagh has no slope_min (a flat lowland wood).
#   - Six coordinates moved to the nearest block of ground at or below 200 m with slope at most 0.08 (at least 15 of the 25 cells around
#     it): Owenduff, the Mullet interior, Montiaghs Moss, Maam valley, Dunlewey, Glenveagh lowlands. Each reason is in its seed-point comment.
# Prototype (scratch): pasture 41.3, forest 26.7, bog 22.1, marsh 5.4+, mountain 4.4 %; bog 260 patches, median 46; forest 239, median 45;
# all 63 named sites have their terrain within 3 x 3 cells. Western districts: Erris 55.7, Connemara 60.2, west Donegal 55.1 % bog.
# r6's prototype, for comparison:
#   pasture about 41.5, forest 26.8, bog 21.8, marsh 5.5+, mountain 4.4 %. Bog median patch about 46 cells, none under 4.
#   Every recorded wood has forest. Bog over the original western districts: Erris 49 %, Connemara 58 %, west Donegal 54 %.

