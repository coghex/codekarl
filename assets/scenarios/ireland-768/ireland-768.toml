[location.ardstraw]
name = "Ard Sratha"
tag = "Uí Fiachrach Arda Sratha, under the Cenél nEógain (church of Eógan)"
note = "Eógan's early bishopric in the Mourne valley (bishops died 680 and 707), later moved to Derry. No one of Ardstraw is named between 760 and 800; no excavation or 8th-century evidence. A crannog at Loch Laoire has been suggested as the local kingdom's centre (local history only)."
