[location.elphin]
name = "Ail Finn"
tag = "Uí Briúin Aí country, Mag nAí (church of Assicus)"
note = "Tírechán (about 690) shows a church at Ail Finn holding one of the patens made by Assicus, Patrick's coppersmith, paired with Armagh. No annal names Elphin before the 1100s. An undated forge at Shankill, its daughter church a kilometre west, may echo the smith-saint. The 'stone of the clear spring' tale is later."
