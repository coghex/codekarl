[location.rechru]
name = "Reachrainn"
tag = "Brega coast, off north Dublin (an Iona foundation, read as Lambay)"
note = "Rechru, founded in 635 (by Ségéne, abbot of Iona, in the Four Masters), read here as Lambay (logainm, Joyce); some read it as Rathlin (Ó Corráin, for the 795 raid). A continuous line of abbots: Murgal son of Ninnid (d. 769, abbot in 768), Áed son of Cairpre (d. 773), Feradach son of Ségéne (d. 799). Burned by the Norse in 795. Lambay is about 2.5 km²; a church and an undated burial survive."
