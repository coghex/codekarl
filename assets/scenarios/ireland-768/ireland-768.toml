tag = "Cork Harbour (Uí Liatháin country, inferred)"
note = "A monastery in Cork Harbour in the Life of Carthach (Mochuda stayed a year), founded about 635 in local tradition; no trace has been found. The Four Masters name 'Sealbhach of Inis Pich' (d. 821, title not given), and Spike Island is only the likely identification. No community is attested before 768; no one is named."
proposed_kind = "monastery"
proposed_size = 1
