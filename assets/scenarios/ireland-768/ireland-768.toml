[location.st_mullins]
name = "Tigh Moling"
tag = "Uí Cheinnselaig (church of Moling)"
note = "Moling's monastery on the Barrow (d. 697; he won the remission of the Bórama tribute in legend). The annals do not mention it 760-800 (first 888). The Book of Mulling is late 8th to early 9th century, too loose to place it here in 768; its circle drawing is now read as liturgical, not a plan. Royal burials of the Uí Cheinnselaig are a tradition without early named kings. The surviving churches, tower stump and cross are later."
