[location.tory]
name = "Toraigh"
tag = "Cenél Conaill country, off the Donegal coast (a Columban house)"
note = "A Columban island house (Colum Cille's, by late tradition, with Ernán as first abbot), its church rebuilt by the Cenél Conaill in 616. A sanctuary: in 733 Dúngal, a former king of Dál Riata, profaned it by dragging out Bruide. No one is named here between 760 and 800; the round tower and Tau cross are later. About 4 km²."
proposed_kind = "monastery"
