[location.clonenagh]
name = "Cluain Eidhneach"
tag = "Loígis country, Leinster (church of Fintan)"
note = "Fintan's monastery (d. 603), famed for the severest of rules: no milk, butter or farm animals, until Canice of Aghaboe persuaded him to relax it for his monks. A poem calls him 'chief of the monks of Europe'. Its abbot Mael Aichthen died in 772; the annals name no one else here between 755 and 845. Possible inner and outer enclosures and twelve cross-slabs (unexcavated); the church is 15th-16th century. A late tradition says Óengus the Culdee was raised here."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "Size 1 to 2: a famous founder's house with a recorded abbot; the enclosures are unexcavated, so not added."

[location.killeigh]
name = "Cill Aichidh"
tag = "Uí Failge (church of Sinchell)"
note = "Sinchell's monastery of Cell Achaid Droma Fota, with an abbacy recorded from the 8th to the 10th century beside the heads of the great houses. A very large enclosure, a double bank and ditch over 500 m across on geophysics (Gibson 2005), part of its bank found in 1999; the standing remains are later Augustinian and Franciscan. The 768 abbot is unknown (Conbrann died in 767). Burned with its new oratory in 805. No source ties the Uí Failge kings to it before their later burials."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Size 1 to 2 and add the enclosure (the double bank, part excavated 1999)."

[location.rahan]
name = "Raithean"
tag = "Fir Chell, south-west Mide (church of Carthach)"
note = "Mo Chutu's first monastery, before he was expelled in 636 and went to Lismore. The abbacy is said to have run in the Ua Suanaig family (secondary sources); its abbot Fidairle ua Suanaig died in 763, his brother the anchorite Fidmuine in 757; the 768 abbot is not named. A very large D-shaped enclosure about 500 by 325 m with bank, ditch and inner enclosures on geophysics, undated; the Romanesque churches are 12th century."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "Size 1 to 2: a major saint's house with a very large enclosure (undated, so not added)."

[location.lemanaghan]
name = "Liath Mancháin"
tag = "Delbna Ethra, Mide (church of Manchán; tied to Clonmacnoise)"
note = "Manchán's monastery (d. 665) on a dry island in raised bog, given (in tradition) to Clonmacnoise by Diarmait mac Áedo Sláine. A timber trackway (togher) crosses the bog to it, its first phase an oak plank walk dated 653; St Mella's cell lies 350 m east by a paved causeway, its burials dated 662-817 and 707-939 (a nunnery, perhaps). No one is securely named here in 768 (the Four Masters' 'abbot of Liath' of about 772 may be another Liath). Its shrine is 12th century."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on a bog island (r158: effects from the surrounding land, here raised bog; the togher is its road)."

[location.connor]
name = "Coinnire"
tag = "Dál nAraidi (church of Mac Nisse)"
note = "Mac Nisse's church (d. 507 or 514), a bishopric (Bishop Do-Chonna died 726), said in secondary sources to be the chief church of the Dál nAraidi. Its abbot Ainfchellach also held Lann Ela (Lynally) in Mide at his death in 778, a high-status pairing. Only small watching briefs nearby: a ditch up to 5 m wide, undated."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "Size 1 to 2: a bishopric and the Dál nAraidi church, its abbot holding a second, distant house."

[location.antrim]
name = "Aontroim"
tag = "Dál nAraidi (a church tied to Bangor), 3 km from An Ráth Mhór"
note = "Óentreb, a church tied to Bangor (two abbots of Bangor were 'of Aentrab', 613 and 728); its founder is uncertain. The annals record nothing here between 729 and 823. The round tower is 10th-11th century; a curving ditch about 10 m wide (2009) may be part of its enclosure (undated); a large graveyard. Comgall's relics were brought here from Bangor after the Norse raid of 824."
proposed_kind = "monastery"
