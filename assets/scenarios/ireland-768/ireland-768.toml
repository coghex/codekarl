[location.inishmurray]
name = "Inis Muirígh"
tag = "Cairpre Droma Cliab, off the Sligo coast (church of Molaise)"
note = "Molaise's island monastery, about 3.75 by 0.75 km, 7 km out in Donegal Bay. Its great stone cashel (52 by 40 m, walls up to 4 m thick) is unexcavated and probably 9th century, so in 768 the monks probably lived inside an earlier timber or earth enclosure; Teach Molaise's mortar dates 690-980. The last abbot named before 768, Dícuill son of Menide, died in 752. Plundered by the Norse in 795 (the Annals of Inisfallen) and burned in 807."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
