[location.saul]
name = "Sabhall"
tag = "Dál Fiatach (an Armagh church; Patrick's 'barn')"
note = "Patrick's first church by tradition, the barn given by Díchu (Muirchú, about 700), and the place of his death; his body was carried to Dún Lethglaise for burial, the Uí Néill and the Ulaid fighting over the relics. A small coarbial church of Armagh in the Dál Fiatach heartland: an early-Christian mortuary house and an 8th-century cross-slab; no one of Saul is named before 1012; the priory is 12th century."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
