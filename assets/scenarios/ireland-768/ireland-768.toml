[location.aidne_seat]
name = "Dúrlas Guaire"
tag = "Uí Fhiachrach Aidne, south Galway"
note = "Not in the scenario. A stand-in seat for the kings of Aidne. No 8th-century seat is attested; Westropp (1919) identified Ráth Dúrlais at Dungory near Kinvara (53.1435, -8.9247), a promontory fort with a bank and ditch and a double-banked rath, as Durlas Guaire, Guaire's residence in tradition (the tower house there is about 1520). The Aidne kings in this period are minor: Conchobar son of Cumascach (d. 769), Art son of Flaithnia (killed 772); the king of Connacht beat the Uí Fhiachrach at Carn Conaill in Aidne in 784."
