[location.cairpre_seat]
name = "Cairpre Droma Cliab"
tag = "Cenél Cairpri of Sligo (Carbury)"
note = "Not in the scenario. A stand-in seat for the kings of Cairpre Droma Cliab, whose church is Drumcliff; no royal site of theirs is known (a double-ditched enclosure at Caltragh, 7 km south, is dated 772-973 and tied to no one). The Cenél Cairpri fought the Uí Briúin (754), the Brecraige (752) and the Luigne (Caill Tuidbig, 762)."
proposed_kind = "ringfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort in the Drumcliff plain (about 54.330, -8.470: placement, not a found site), with the seat mark of Cairpre Droma Cliab."

[location.granard]
name = "Gránard"
tag = "Cenél Cairpri of Tethbae (North Tethbae)"
note = "Granard, the centre of North Tethbae: the Moat of Granard is a Norman motte (1199) said to stand on an earlier ringfort (unexcavated tradition); its church is Guasacht's, Patrick's bishop in the Tripartite Life. The Black Pig's Dyke nearby is Iron Age. A branch of the descendants of Cairpre son of Niall, separate from the Sligo Cairpre."
proposed_kind = "ringfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "New location: the royal ringfort under the Moat of Granard (53.7751, -7.5006), with the seat mark of the Cenél Cairpri of Tethbae."

[location.loegaire_seat]
name = "Cenél Lóegairi"
tag = "Cenél Lóegairi, between the Boyne and the Blackwater (Trim's kingdom)"
note = "Not in the scenario. A stand-in seat for the kings of the Cenél Lóegairi, clients of Brega or Mide; their chief church is Trim. No royal site is named; the Tripartite Life puts the fortress of Feidlimid son of Lóegaire at Trim, and excavation under Trim Castle found early medieval buildings, an oven and an animal corral beneath the Norman ringwork of 1172."
proposed_kind = "ringfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort at the Trim Castle site (53.5550, -6.7897), with the seat mark of the Cenél Lóegairi."

[location.uliathain_seat]
name = "Uí Liatháin"
tag = "Uí Liatháin, east Cork"
note = "Not in the scenario. A stand-in seat for the kings of the Uí Liatháin, a peripheral people of the Eóganacht world (their legendary links run to Britain); their church is Cloyne. No 8th-century royal site is known; the only link is the name Castlelyons (Caisleán Uí Liatháin), whose castle is 13th century."
proposed_kind = "ringfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort at Castlelyons (about 52.089, -8.234: placement), with the seat mark of the Uí Liatháin."

[location.ciarraige_seat]
name = "Ciarraige Luachra"
tag = "Ciarraige Luachra, north Kerry"
note = "Not in the scenario. A stand-in seat for the kings of the Ciarraige Luachra, the people who gave Kerry its name; their church is Ardfert. No royal site is known (large forts around Ardfert, Abbeydorney and Tralee may have been chiefs' seats). Rivals of the Eóganacht Locha Léin: they killed Áed Alláin in battle in 803."
proposed_kind = "ringfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort near Ardfert (about 52.335, -9.770: placement), with the seat mark of the Ciarraige Luachra."

[location.monaincha]
name = "Loch Cré"
tag = "Éile, north Munster (Ros Cré's island hermitage)"
note = "Inis na mBeo, 'the island of the living': Ros Cré's hermitage on an island in Loch Cré (the lake was drained about 1800; now a mound in bog 3 km east of Roscrea, 52.9463, -7.7482). Tied in tradition to Canice, Crónán and Elair; Giraldus later wrote that no one could die on it. Its anchorite and scribe Elarius (d. 807) was one of the Céli Dé, consulted by the Tallaght circle, living on bread from Roscrea. Nothing on the island is dated to the 8th century; the church is 12th century; a second island to the west held a women's church."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New location (owner r178: island monasteries), size 1. A monastery on an island in a lake (r158)."

