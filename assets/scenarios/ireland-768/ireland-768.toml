[location.dromiskin]
name = "Droim Ineasclainn"
tag = "Conaille Muirthemne (church of Lugaid; Rónán son of Berach)"
note = "A Conaille church on the edge of the Dundalk Bay marshes, founded in tradition by Lugaid son of Óengus. Its man Crunnmael became abbot of Clonard (d. 793; placed there). Rónán son of Berach's relics, perhaps Dromiskin's, were put in a gold and silver shrine about 800. An inner enclosure is inferred from the road line, with early cist burials; the round tower is 9th century, the cross 10th. The 768 abbot is not named. Burned by the Norse in 833."
proposed_kind = "monastery"
