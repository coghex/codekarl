[location.inis_patraic]
name = "Inis Pádraig"
tag = "Brega coast, off Skerries"
note = "St Patrick's Island, a small islet 1.5 km off Skerries, burned by the Norse in 798, when the cattle-tribute of the territories was taken and the shrine of Do-Chonna (Mochonna, a relic saint, d. 684 in tradition) was broken. No one is named here in 768. The church ruin is 12th century; the canons moved to Holmpatrick about 1220. (One scholar places Inis Pátraic on the Isle of Man; Skerries is the leading reading.)"
