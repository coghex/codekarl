[location.kilmacduagh]
name = "Cill Mhic Duach"
tag = "Uí Fhiachrach Aidne (church of Colmán mac Duach)"
note = "Colmán mac Duach's church, by tradition given land by his kinsman King Guaire Aidne; the church of the Aidne kings, later their diocese. No cleric is named before the bishop who died in 814. A subcircular enclosure bank about 67 by 62 m survives around Templemurry (undated); the cathedral and leaning tower are later."
proposed_kind = "monastery"
