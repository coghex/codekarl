[location.inchbofin]
name = "Inis Bó Finne"
tag = "Lough Ree (church of Rioc), between Tethbae and the Delbna, under Mide"
note = "Not in the scenario: an island monastery of about 26 ha in Lough Ree, the Westmeath side near Tang, founded by Rioc, Patrick's nephew in tradition. Its abbot Fiangalach son of Anmchad died in 755 ('on Loch Rí'); no one is named here 756-813. Two later churches in a cashel; early cross-slabs (one 'Pray for Cormacan'), none dated to the 8th century. Raided by Brian Bóruma's son in 1016."
