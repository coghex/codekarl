note = "Ros Ailithir, Fachtna's church (d. about 600), later famed as a school; neither the school nor any person is attested here in the 8th century (first abbot recorded 824). No 8th-century remains (digs at the cathedral found 17th-century burials). The Corcu Loígde kings of this period are uncertain and have no known seat."
