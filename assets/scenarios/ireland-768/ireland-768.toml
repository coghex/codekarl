[location.tuam]
name = "Tuaim"
tag = "Connacht (church of Iarlaithe; Conmaicne country)"
note = "Iarlaithe's church, whose rise came in the 11th-12th century under the Ua Conchobair kings. Its first sure record is Abbot Nuadu's death (781). Excavation at Sawpit Lane found 15 burials and a V-shaped ditch dated to the 7th century, probably the first enclosure (one up to 120 m across has been proposed), with smithing waste and a bone trial piece."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church", "enclosure"]
