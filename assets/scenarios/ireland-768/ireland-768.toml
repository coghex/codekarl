[location.ui_echach_seat]
name = "Cnoc Uí Echach"
tag = "Uí Echach Cobo, Iveagh (west Down)"
note = "Not in the scenario. A stand-in seat for the Uí Echach Cobo kings ('kings of Cuib'), who fought the Ulaid and the Airthir at Áth Duma (761, 776) and the Conaille at Cenu (786). No 8th-century seat is attested; Knock Iveagh, a hilltop cairn near Rathfriland (54.275, -6.185), was the later Magennis inauguration place and 'may have been the centre of Uí Echach power'. Lisnagade, a triple-ringed rath, has no proven royal tie."
proposed_kind = "ringfort"
