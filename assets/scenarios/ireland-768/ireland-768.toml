[location.annaghdown]
name = "Eanach Dhúin"
tag = "Connacht, east shore of Lough Corrib (Delbna or Uí Briúin Seóla)"
note = "Annaghdown, where Brendan visited his sister Bríg in a late Life (a women's house, in tradition only). The annals do not name it before the 12th century; a 'Ciarán of Annaghdown' is in a saints' list of about 800. The only dated enclosure ditch is 11th-12th century; the cathedral, nunnery and priory are later."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
