[location.cong]
name = "Conga"
tag = "Connacht, between Lough Mask and Lough Corrib (church of Féichín)"
note = "Féichín's church on the isthmus (founded in the 620s by tradition, with a grant from Domnall son of Áed). The annals name no one here between 755 and 800 and nothing before 1114; no 8th-century remains (the ruins are 12th-13th century). Its overlord in 768 is not recorded (Uí Briúin Seóla, Conmaicne or Partraige)."
proposed_kind = "monastery"
