[location.tethbae_seat]
name = "Ráth Ardachaidh"
tag = "South Tethbae (kings of Tethba)"
note = "Not in the scenario. A stand-in seat for the kings of Tethba: the triple-ringed ringfort with iron-working that de Paor excavated beside Mél's church at Ardagh. Béc son of Conla, king of Tethba, dies in 771; his son Diarmait, king after him, falls at Ard Ablae in 791. North Tethbae's Cenél Cairpri kings (centred on Granard) are logged for later."
