[location.dunleer]
name = "Lann Léire"
tag = "Ard Cianachta, under Brega (church of Forodrán and Báethéne)"
note = "A coarbial and episcopal house with abbots in the annals in 721, 745 and 781 (later bishops, and superiors who were also stewards of Armagh); no Louth monastery appears more often in the annals. Nothing of the 8th century survives (three undated cross-slabs; the one dig found nothing). Its local kings are those of Ard Cianachta (Muiredach son of Aengus, d. 779; Cellach son of Cormac, d. 786)."
proposed_kind = "monastery"
