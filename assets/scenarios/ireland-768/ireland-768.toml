[location.inishmacsaint]
name = "Inis Mac Saint"
tag = "Lower Lough Erne, Airgíalla country (church of Ninnid)"
note = "Ninnid's island monastery (a pupil of Finnian of Clonard, 6th century by tradition). Its superior Fiannamail grandson of Bógaine died in 718 (AU, identification conventional); no one is named for 768. The tall unringed cross and the churches are probably later (the west church perhaps 10th-11th century)."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r179), size 1. A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.white_island]
name = "An tOileán Bán"
tag = "Lower Lough Erne, Airgíalla country"
note = "White Island, about 32 ha: nothing is known of its early history and its old name is lost. Its famous carved figures are 9th century or later; a church of about 1200 stands in a pre-Norman earthwork enclosure. It may be Eo-inis, where Constans 'the learned' was priest and anchorite (the Martyrology of Gorman), but that is unproven (another list names Eo-inis separately): Constans is placed here by choice."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r179), size 1; name changed from Eo-inis to An tOileán Bán (the Eo-inis identification is unproven). A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.inishkeel]
name = "Inis Caoil"
tag = "Boylagh, Cenél Conaill country (church of Conall Cael)"
note = "Conall's island monastery (late 6th century), a tidal islet about 500 m off Portnoo. Cross-slabs of the 8th-9th century; Conall's bell (7th or 8th century) is in the British Museum; the churches are 12th-13th century. No annal names it 760-800; no one is named for 768."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r179), size 1. A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.inishkea_north]
name = "Inis Gé Thuaidh"
tag = "off the Mullet, Erris (Connacht)"
note = "A small flat island 5 km offshore with beehive huts and cross-slabs of the late 7th-8th century on the Bailey Mór mound (Henry's digs, 1937-50). Heaps of smashed dog-whelk shells may mean purple dye was made here, but that is a theory, not a finding. No written record names a monastery; no one is named for 768."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r180), size 1. The dye is uncertain. A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.inishglora]
name = "Inis Gluaire"
tag = "off Erris (Connacht; church of Brendan, by tradition)"
note = "Brendan's island church: a roofless early church, later men's and women's churches, three beehive cells, a well, cross-slabs and a pillar stone, none dated; the community is said to have moved to the mainland about the 10th century. No annal names it; no one is named for 768."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r180), size 1. A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.church_island_valentia]
name = "Oileán an Teampaill (Dairbhre)"
tag = "Corcu Duibne, Valentia Harbour"
note = "Excavated by O'Kelly (1955-56): a timber hut and oratory replaced by stone ones; a cemetery of at least 33 burials; an ogham cross-slab dated 650-750; a terraced shrine mound with burials of the 7th-9th century. A small community or a notable cult site; no one is named for 768."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r180), size 1. A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.illaunloughan]
name = "Oileán Leacháin"
tag = "Corcu Duibne, the Portmagee Channel"
note = "A 0.3-acre island excavated 1992-95 (White Marshall and Walsh): huts dated from 640-751, an earthen church replaced by an 8th-century drystone oratory, and a gable shrine on a leacht holding relics moved from rock-cut graves. A handful of monks lived on fish and seabirds, grew cabbage, and did fine metalwork. No one is named."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "New (r180), size 1 (perhaps 3-8 monks). A monastery on an island (r158): its farmland, fishing and boat access come from the island and the water around it."

[location.church_island_currane]
name = "Oileán an Teampaill (Loch Luíoch)"
tag = "Corcu Duibne, Lough Currane"
note = "Fínán Cam's island (6th-7th century, by tradition), called the kingdom's earliest church. A Romanesque church, three leachta, a beehive cell and cross-slabs survive, none dated to the 8th century. No one is named for 768."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
