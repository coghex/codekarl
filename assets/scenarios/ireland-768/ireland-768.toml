note = "Domnach Mór Maige Tóchair, Patrick's church in the Tripartite Life (Mac Cairthinn left in charge), the lesser Inishowen house beside Fahan; no annal entry at all. A double circular enclosure was confirmed by geophysics (2016), unexcavated. Its famous cross and pillars are dated by most scholars to the 9th-10th century (a 7th-century date is a minority view), so they are not standing in 768."
