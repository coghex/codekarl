[location.taghmon]
name = "Teach Munna"
tag = "Uí Cheinnselaig (church of Fintan Munnu)"
note = "Fintan Munnu's monastery (d. 635), who argued for the Irish Easter. No one of Taghmon is named in the annals 755-800; its only candidate, Ciarán, abbot of 'Ráith Maige Óenaig and Tech Mo-Fhinnu' (d. 784), is already placed near Ráth Bhoth, where his church more likely lay. A high-cross base (8th century?) survives. In 817 its community, led by the Uí Cheinnselaig king, won a battle against the community of Ferns with four hundred slain: later than 768."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
