# Real figures for the 768 start: the values set by hand (draft r1). Drafted by Claude (ck-designer-1), 2026-11-16, from
# owner-direction-designer-r139 to -r144. Research notes and sources: lists/figures/ireland-768.md. Reviewed on the figures review page.
#
# Only hand-set values live here (real-characters-r4): everything not listed is generated as for anyone, from culture, genetics and
# the generated life (char-gen-r5), within the limits below.
#   born / died: years; `est` marks an estimate (basis in `note`). A recorded death year is shown, not forced (proposal).
#   The game starts 9 October 768 (scenario.toml): a figure who died in 768 is dead at the start unless the annals place the
#   death later in the year; such figures stay for trees and history, marked 'dead before the start' (r149).
#   forced: traits and attributes the sources give (none recorded so far).
#   excluded: conspicuous conditions the sources would have recorded had they been there (owner r144: generate only what could
#     theoretically exist). [defaults.excluded] applies to every real figure unless a figure lists its own.
#   relations: relationships forced at the start (others are rolled as usual, r144).
#   beats: life beats (real-characters-r4).
#   orientation: generated at random unless the records attest it (owner r145); set it on a figure only when attested.

# languages (r162, r184): a mother tongue, always fluent (keys as the game's P3 data, CK-356: old_irish, dialect irish, for the Irish; Northumbrian for
# Mayo's English), and second languages 0-1.0, a [low, high] range rolled at generation; a character's languages never change. Latin by office in 768: bishop, abbot, abbess, scribe, lector, the learned and
# anchorites 0.60-0.95; prior 0.40-0.80; monk or priest 0.20-0.60; lay steward 0-0.30; a child 0-0.20.
# Exceptions: Virgil of Salzburg (a famed scholar, in Bavaria since about 743: Old High German).
[defaults]
excluded = ["blind", "madness", "fool:S", "dwarfism", "hunchback", "club_foot", "harelip", "albino", "deaf"]
# fool:S = fool at grade S or above is excluded; lower grades may be rolled

[location.ailech]
name = "Grianán Ailigh"
tag = "Cenél nEógain"
note = "A dry-stone cashel about 23 m across inside an older hillfort, on Greenan Mountain. Its date is disputed (some say built before 800 by Áed Oirdnide); no houses were found in it, so in 768 the king's household may have lived nearby rather than inside. The location stands for the Cenél nEógain court. Fahan, nearby, was the dynasty's church (its own chunk)."
proposed_kind = "cashel"
proposed_size = 3
proposed_buildings = ["enclosure"]
proposed_why = "A stone cashel inside an older hillfort (Heritage Ireland; Wikipedia). Its date is disputed (perhaps c. 790-800). Keep size 3 as the Cenél nEógain seat."

[location.armagh]
name = "Ard Mhacha"
tag = "Airgíalla (the Airthir); the church of Patrick"
note = "The chief church of Patrick and the largest monastery in Ireland. In these decades the abbacy was contested (rival abbots, a battle in 759, the church burned in 775 and 783, invaded in 793). The annals name abbots, a bishop and stewards here, but no lector, scribe or anchorite between 750 and 800."
proposed_kind = "monastery"
proposed_size = 4
proposed_buildings = ["church", "enclosure"]
proposed_why = "No change: the largest church; several churches and a stone oratory are named in the annals (789)."

[location.clonmacnoise]
name = "Cluain Mhic Nóis"
tag = "Mide / Connacht border; a church of all Ireland"
note = "One of the greatest churches, on the Shannon. Abbots came from many Connacht and Mide peoples; the annals name a new abbot every few years from 768 to 799, a steward and scribes, but no bishop, lector or anchorite for these years. Burned 755 and 778; its community fought Durrow's in 764 (Argaman)."
proposed_kind = "monastery"
proposed_size = 4
proposed_buildings = ["church", "enclosure"]
proposed_why = "No change. Its famous high crosses are about 900, later than 768, so no high_cross."

[location.kildare]
name = "Cill Dara"
tag = "Laigin; the church of Brigit"
note = "A double community of nuns and monks under an abbess, with an abbot and bishops beside her; its offices were held by kin of the Uí Dúnlainge kings of Laigin. Burned 775 and 779; the battle of the Curragh (782) was fought nearby."
proposed_kind = "monastery"
proposed_size = 4
proposed_buildings = ["church", "enclosure"]
proposed_why = "No change: a double house of nuns and monks."

[location.rathcroghan]
name = "Ráth Cruachan"
tag = "Connachta"
note = "The ancient royal site of Connacht, standing for the Connacht kingship, which rotated between rival branches (Uí Briúin Síl Cathail, Síl Cellaig, Síl Muiredaig; Uí Fiachrach Muaidhe). The king Dub-Indrecht dies in 768; the annals name no successor that year. A 'king of Cruachain Aí' (the plain around Cruachan) is named in 774."
proposed_kind = "ceremonial_ground"
proposed_size = 3
proposed_buildings = ["enclosure"]
proposed_why = "A complex of mounds, enclosures and burial sites: the Connacht kings were inaugurated and assembled here but lived elsewhere. The Connacht seat mark stays here until a residence is placed."

[location.cashel]
name = "Caiseal"
tag = "Mumu (Eóganachta)"
note = "The seat of the kings of Munster. In 768 the kingship is contested: the king-lists give Cathussach of Eóganacht Áine (742-769), while Máel Dúin of Eóganacht Locha Léin is called king of Munster in some annals; no annal names a king of Cashel in 768, and no court member is named."
proposed_kind = "cashel"
proposed_size = 3
proposed_buildings = ["enclosure"]
proposed_why = "The Rock of Caiseal: the name is from caisel, a stone fort (from Latin castellum). No church is attested here in 768; the cathedral and chapel are much later."

[location.tara]
name = "Teamhair"
tag = "the kingship of Tara (a title)"
note = "The Hill of Tara: about 130 monuments, nearly all prehistoric or Iron Age (Ráith na Ríg, the Mound of the Hostages, the 'Banqueting Hall' earthwork). No evidence that anyone lived there in 768, nor of a church (the first is 1190s) or an assembly in these years. The kingship of Tara is the highest title in Ireland, held in 768 by Niall Frossach; the hill itself is ceremonial."
proposed_kind = "ceremonial_ground"
proposed_size = 3
proposed_buildings = ["enclosure"]
proposed_why = "No residents in 768: a ceremonial ground that names the high kingship. Keep size 3 for its standing."

[location.uisneach]
name = "Uisneach"
tag = "Mide (Clann Cholmáin)"
note = "The hill at the centre of Ireland: about 35 monuments over 2 km², with the Catstone and Rathnew, two joined enclosures 112 m across with small stone buildings, a souterrain and metalworking, built perhaps in the late 7th or 8th century over an Iron Age ceremonial enclosure: an elite residence and ceremonial centre (Schot). The Clann Cholmáin's power base lay east on Lough Ennell (Dún na Sgiath), but royal use there is documented only from the 11th century."
proposed_kind = "ceremonial_ground"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "A ceremonial hill with a royal residence (Rathnew) on it; the Mide seat mark stays here. A separate proposal: Dún na Sgiath on Lough Ennell, as a later royal ringfort (to research)."

[location.knowth]
name = "Cnóbha"
tag = "Northern Brega (Uí Chonaing)"
note = "Knowth: the great passage-tomb mound, reused as the Uí Chonaing kings' seat (Cnogba)."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "No change: the Uí Chonaing seat (from memory: an early medieval settlement of houses and souterrains on and around the old mound, Eogan's excavations; to check)."

[location.lagore]
name = "Loch Gabhair"
tag = "Southern Brega (Uí Chernaig)"
note = "Lagore: the royal crannog of the southern Brega kings (Hencken's excavation, 1950)."
proposed_kind = "crannog"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "No change."

[location.naas]
name = "An Nás"
tag = "Laigin (Uí Fáeláin)"
note = "The dún of Naas is named in the annals under 705; the visible mound is a Norman motte (late 12th century) probably on the dún's site. Nothing of the 8th century has been excavated. 'At various times' a capital of the kings of Leinster; the Uí Fáeláin seat."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "A 'dún' (fort) whose form is unknown; ringfort is the safest kind. Keep size 2 as the Uí Fáeláin seat."

[location.lyons_hill]
name = "Liamhain"
tag = "Laigin (Uí Dúnchada)"
note = "Lyons Hill: a hilltop cairn about 10 m across inside the faint remains of an oval enclosure; an early royal seat, assembly and inauguration place of the Uí Dúnchada (Wikipedia; the Dindshenchas poem Liamuin), whose Cellach is king of Laigin in 768. Not excavated."
proposed_kind = "ceremonial_ground"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "An inauguration and assembly hill used as the Uí Dúnchada seat: ceremonial ground, size 2 (was ringfort 1; the earlier proposal was ringfort 2)."

[location.mullaghmast]
name = "Maistiu"
tag = "Laigin (Uí Muiredaig)"
note = "Mullaghmast: a rath on an escarpment above the Barrow valley, an early medieval meeting centre and the Uí Muiredaig seat (Bran Ardchenn's branch). Not yet in the scenario file: proposed in scenario/locations-r1.toml."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "New location (proposed in the draft as royal_site 2): a rath, so ringfort 2."

[location.downpatrick]
name = "Dún Pádraig"
tag = "Ulaid (Dál Fiatach)"
note = "Dún Lethglaise: in the 8th century a ditched church settlement on Cathedral Hill with timber buildings and a cemetery; its abbots are named in the annals and one was a king's son. The 'hillfort' bank is not prehistoric, and the Mound of Down is undated (probably 11th century). A royal residence here is plausible but undocumented."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "The evidence is of a royal monastery, not a fort: monastery 2 (was royal_site 2). The Ulaid seat mark stays here until a residence is found."

[location.raphoe]
name = "Ráth Bhoth"
tag = "Cenél Conaill (seat stand-in)"
note = "A church of Columba's community in Mag nÍtha, the Cenél Conaill heartland. First dated mention 815-817; only a 9th-10th-century carved lintel survives. No source names where the 8th-century Cenél Conaill kings lived or were inaugurated (Doon Rock is attested only from 1258)."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "No change to the place. Proposed as the Cenél Conaill seat stand-in (a game choice: it is inside Mag nÍtha and better grounded than Croaghan Hill); the court is placed here."

[location.croaghan_hill]
name = "Cruachán Maige Ítha"
tag = "(proposed new location)"
note = "A hillfort about 85 m across, a collapsed stone wall up to 5 m wide, a cairn 21 m across inside: probably prehistoric, undated, unexcavated, with no documented link to the Cenél Conaill (hobbyist sources)."
proposed_kind = "hillfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "Keep as a place (an old hillfort over Mag nÍtha), not as a seat: hillfort 1, without the seat mark (the draft had royal_site 2)."

[location.clogher]
name = "Clochar"
tag = "Airgíalla (Uí Chremthainn)"
note = "An Iron Age hillfort, reoccupied by the 5th century; a ringfort about 60 m across built inside it around the 7th century, with Mediterranean and French pottery and large-scale bronze casting (Warner, 1969-77). The heritage service says it ceased to be a royal centre after the 8th century. The church Clochar Mac nDaiméni stands in the town below."
proposed_kind = "hillfort"
proposed_size = 2
proposed_buildings = ["enclosure", "church"]
proposed_why = "A hillfort with a royal ringfort inside: hillfort 2 (was royal_site 2); keep the church. Its royal use may be fading by 768."

[location.ferns]
name = "Fearna"
tag = "Uí Cheinnselaig (church)"
note = "Máedóc's great church ('Ferna Mór'): an outer enclosure ditch radiocarbon-dated to the 7th-8th century, a large centre (2021 excavation). Its abbot and steward fought a battle here in 783. No Uí Cheinnselaig royal residence at Ferns is known before the 10th-11th century; their early seats were around Rathvilly and the upper Slaney."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 3; add the enclosure (the dated ditch). The king's battle of 769 was fought here, but the Uí Cheinnselaig seat should be a new location near Rathvilly (to research); until then their court is placed here."

[location.gowran]
name = "Belach Gabráin"
tag = "Osraige (proposed new location)"
note = "A pass between Osraige and Leinster and a battle site (761). Local tradition (Carrigan) and a 2012 excavation report call Gowran a meeting place and royal residence of the kings of Osraige before the Normans; no early feature has been found and no 8th-century source names it as the seat."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "Keep as the Osraige seat by tradition (a game choice, low confidence); the kind of the royal site is unknown, so ringfort 2 (the draft had royal_site 2)."

[location.aghaboe]
name = "Achadh Bhó"
tag = "Osraige (church)"
note = "Cainnech's chief church; almost nothing of the early monastery survives (a 7th-8th-century bronze monk figure). Its abbot Fergil left to become bishop of Salzburg."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.seirkieran]
name = "Saighir Chiaráin"
tag = "Osraige (church)"
note = "The main Osraige monastery and burial place of the Dál Birn kings; a round-tower base, a 9th-century high-cross base, an earthen enclosure (geophysical survey)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 2; add the enclosure (survey). The high cross is 9th-century: none in 768."

[location.bangor]
name = "Beannchar"
tag = "Ulaid (church of Comgall)"
note = "'Bennchor the Great' (AU 756), Comgall's house of learning on Belfast Lough (the Antiphonary of Bangor, about 680-691). In the 750s a gold tooth of a stranded whale was laid on its altar in King Fiachnae's reign. Burned on St Patrick's Day 756. Excavation suggests a large circular enclosure (inferred, no size) and a cemetery larger than today's; no 8th-century building is known. A cross fragment 'probably about the 8th century' (low confidence)."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 3; add the enclosure (a large circular enclosure, inferred from excavation). No high cross: the one fragment is undated."

[location.clonard]
name = "Cluain Ioraird"
tag = "Mide (church of Finnian)"
note = "Finnian's 'school of the saints' on the Boyne. Its annals name abbots, bishops, a bishop-anchorite and a 'learned man' (sapiens) in these years. Donnchad Midi fought its community in 775 (AU). Burned on Easter night 789. No excavation has found the monastic enclosure (the 1976-77 banks were 13th-century; a 60 m enclosure is a geophysical, undated hypothesis)."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church"]
proposed_why = "No change: the enclosure is not found, so none is added."

[location.durrow]
name = "Darú"
tag = "Mide (Columba's house, of the Iona federation)"
note = "Columba's 'noble monastery' (Bede) in Mide, of the Iona federation; the Book of Durrow was here by the 10th century (where it was made is disputed). A double bank and ditch about 500 m across shows from the air (undated). The high cross is mid-9th century. The burial place of Domnall Midi (d. 763); 200 of its community fell at Argaman (764) fighting Clonmacnoise's, and the community fought for Donnchad Midi in 776."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 3; add the enclosure (the 500 m double bank; undated, medium-low confidence). No high cross in 768."

[location.glendalough]
name = "Gleann Dá Loch"
tag = "Laigin (church of Kevin; Uí Máil)"
note = "Kevin's valley monastery. In 768: a monastic enclosure ditch lined with stone, dated 7th-8th century, with metalworking pits kept outside it (UCD excavations 2014-23); timber churches (the stone churches and round tower are 10th-12th century); hermit sites at the upper lake. Burned 775."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 3; add the enclosure (dated ditch)."

[location.clonfert]
name = "Cluain Fearta"
tag = "Connacht (church of Brendan; Uí Maine country)"
note = "Brendan's church near the Shannon; its abbot is 'coarb of Brénainn'. A 2001 test dig found early medieval buildings east of the church and a ditch, probably the monastery's original enclosure; the earthworks show across the road. An early cross-slab inscribed BECGAN. The cathedral is 12th century and later. Burned 749. No Uí Maine tie is attested before the 9th century."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 3; add the enclosure (the early medieval ditch, 2001)."

[location.emly]
name = "Imleach Iúir"
tag = "Mumu (church of Ailbe)"
note = "Ailbe's church, by tradition Munster's chief church, beside the Eóganacht Áine seat at Cnoc Áine; its heads are 'successors of Ailbe'. 'The law of Ailbe' was in force in Munster in 784 (AI) and promulgated in 793 with the ordination of King Artrí (AU). A very large enclosing ditch with an entrance found in 2002, dated only before the 13th century."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 3; add the enclosure (the large ditch; undated, medium-low confidence)."

[location.lismore]
name = "Lios Mór"
tag = "Déisi (church of Mo Chutu)"
note = "Mo Chutu's church on the Blackwater, a celebrated school, an episcopal and abbatial seat. No 8th-century enclosure or building is known (Lismore Castle of 1185 sits on the site; ironworking waste nearby). The Déisi king of 768 is not attested."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church"]
proposed_why = "No change."

[location.cork]
name = "Corcaigh"
tag = "Mumu (church of Finbarr)"
note = "Finbarr's 'Corcach Mór' by the Lee marshes; whether it stood at the present cathedral or at Gill Abbey is unsettled, and no 8th-century remains are excavated (the town layout found so far is of the 1070s). Its community fought Clonfert's in 807. No local king is attested for 768."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church"]
proposed_why = "No change; the position is uncertain (cathedral or Gill Abbey)."

[location.movilla]
name = "Maigh Bhile"
tag = "Ulaid (church of Finnian of Movilla)"
note = "Finnian's church in the Ards, once one of Ulster's leading churches and schools. Excavation (1980-81) found a large, busy early community: timber buildings rebuilt many times, metalworking and glass-working; the site is catalogued as an ecclesiastical enclosure (size not found). Its one early stone (the Dertrend slab) is probably 10th century. The annals name no one here between 749 (Abbot Liber) and the Viking raid of about 824."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Size 3 to 2: the scenario ranks size by prominence in the 8th-century annals, and Movilla is absent from them 750-800. Add the enclosure (catalogued)."

[location.derry]
name = "Doire"
tag = "Cenél Conaill / Cenél nEógain border (Columba's house, of the Iona federation)"
note = "Daire Calgaich on the Foyle, a Columban house; who held it in 768 is not documented (Cenél Conaill founders in the 6th century, Cenél nEógain by the 9th). Its site (St Augustine's or the Long Tower) is uncertain and unexcavated; the round-tower stump found in 2018 is 13th-14th century. Burned in 788 (AU; by whom is not said). No one here is named 755-800."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change; the position is uncertain."

[location.terryglass]
name = "Tír Dhá Ghlas"
tag = "Mumu, north (Múscraige Tíre; church of Colum mac Crimthainn)"
note = "Colum mac Crimthainn's church on Lough Derg, where Áed Allán and Cathal of Munster met in 737, the first meeting the annals call a rígdál. A test dig (2003) crossed the line of its ecclesiastical enclosure; no size and no 8th-century buildings. More than a hundred Connachtmen drowned here in 777 (AI). The local king for 768 is not attested."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 2; add the enclosure (its line is known)."

[location.birr]
name = "Biorra"
tag = "Mide / Munster border (church of Brendan of Birr)"
note = "Brendan of Birr's church; the Synod of Birr (697) proclaimed Adomnán's Law of the Innocents here. Its community fought Clonmacnoise's in 760 (AU; no winner named). The site lies under the Church Street churchyard; nothing of the 8th century is excavated. Mac Riagoil wrote the Macregol Gospels here about 800."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.mayo]
name = "Maigh Eo"
tag = "Connacht (an English house: 'Mag nEó na Saxan')"
note = "Founded about 668 by Colmán for about 30 English monks who left Inishbofin after Whitby (Bede); still English in Bede's day and for generations. Alcuin of York wrote to its bishop and monks. Its enclosure is reported as about 400 m across (History Ireland via Wikipedia, unchecked), which would match the great churches; a 7th-9th-century burial and a monastic enclosure boundary found in 2009; LiDAR earthworks (2023), unanalysed. Burned by lightning in 783 with Armagh."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2 (the 400 m enclosure is unchecked); add the enclosure. Its community should be of an English culture, which the game does not have yet (a proposal below)."

[location.roscommon]
name = "Ros Comáin"
tag = "Connacht (church of Commán; Uí Briúin of Mag nAí)"
note = "Commán's church on Mag nAí, near the Uí Briúin kings. 'The law of Comán' was enforced across Connacht in 771 and 779 and proclaimed in 793 by Abbot Aildobur with King Muirgius. Nothing of the 8th century has been excavated (the 'vat' is a natural spring)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.devenish]
name = "Daimhinis"
tag = "Fir Manach / Lough Erne (church of Molaise)"
note = "Molaise's island monastery in Lough Erne, reached only by water. The round tower and St Molaise's House are 12th century; in 768 the churches were wood. A geophysical survey (2000-01) shows possible buildings and small enclosures (undated). The annals name no one here between 755 and 800. Raided by the Norse 822 and 837."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on a small island in Lough Erne: little farmland, some fishing (r158)."

[location.nendrum]
name = "Naondroim"
tag = "Ulaid (church of Mochaoi, Strangford Lough)"
note = "Mochaoi's island monastery on Mahee Island: three concentric stone enclosures (sizes unverified), workshops in the middle one (some 30 slate trial pieces), a stone jetty, and the tide mills: the first built in 619, a later one in 788-789. The annals name no one here after Abbot Snéidcheist (d. 755)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep monastery 2 and its enclosure. The tide mill (working in 768) waits for the buildings design (r158). A monastery on a small island: little farmland, some fishing (r158)."

[location.finglas]
name = "Fionnghlas"
tag = "Brega/Laigin border (church of Cainnech; a Céli Dé house)"
note = "Finnglas Cainnig: an established house of bishops, scribes and anchorites. Dublitir led the joint synod of the Uí Néill and Laigin at Tara in 780 and was, with Máel Ruain of Tallaght, a leader of the Céli Dé reform; he allowed ale where Tallaght forbade it. A proposed early enclosure follows the curve of Church Street (an undated ditch on its line). A women's house may have stood beside it (unproven). Fáelchú of Finglas died in 762."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (Swan's proposed line, with an undated ditch along it: medium confidence)."

[location.louth]
name = "Lú"
tag = "Conaille Muirthemne (church of Mochta, a Briton by tradition)"
note = "Mochta's church, with its own line of abbots (not shared with Armagh; tied by kin: Torbach, son of a Louth abbot, became abbot of Armagh). A literate house: the lost 'Book of Cuanu' may be its annal. Nothing of the 8th century is excavated; no raid before the Norse (831). Its neighbour king: Slóigedach of Conaille Muirthemne (d. 788), for when the Conaille seat is researched."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.monasterboice]
name = "Mainistir Bhuithe"
tag = "Ciannachta, under Brega (church of Buite)"
note = "Buite's monastery. A geophysical survey (2007) shows an inner enclosure about 85 m across with an annexe and an outer one about 310 by 200 m, with souterrains (undated). The crosses, tower and stone churches are 9th century and later; in 768 timber and earth. A hereditary abbacy: Cormac son of Ailill (d. 763), then his son Dubdáinbher (drowned in the Boyne 766); the 768 abbot is unknown. Said to be a house of monks and nuns (no 8th-century source)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (geophysics: an inner enclosure about 85 m, an outer about 310 by 200 m). The outer one, if 8th century, would argue for size 3: undated, so not proposed."

[location.roscrea]
name = "Ros Cré"
tag = "Éile, north Munster (church of Crónán / Mo Chua)"
note = "Crónán's monastery on the Slighe Dhála, one of the chief churches of Éile; its island hermitage on Loch Cré (Monaincha) is Crónán's first site. The Book of Dimma, a pocket Gospel book of the late 8th century, was probably written here by a scribe who signed himself Dianchride. Excavation found kilns, furnaces and slag near the round tower (undated). No event recorded 760-800: a quiet, mid-ranking house. Abbot Daniél died in 761."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change. Loch Cré (Monaincha) logged as a possible location of its own."

[location.duleek]
name = "Damhliag"
tag = "Brega (church of Cianán; Ciannachta lands under Síl nÁedo Sláine)"
note = "Cianán's church, named 'stone house' (Damliag) for what tradition calls Ireland's first stone church; the name is attested about 690 (Tírechán, second-hand) and in the annals from 724, but no standing fabric is securely 8th century. A full set of offices: abbot, bishop and steward. The enclosure line survives in the street pattern, and probable Early Christian features lie beside its bank (2008). No raid before the Norse (831). Fedach son of Cormac (placed at Lú) later held it with Lú and Slane."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (the street line, with features beside the bank: medium). A stone church waits for the buildings design (r158)."

[location.clones]
name = "Cluain Eois"
tag = "Airgíalla (church of Tigernach; Uí Chremthainn, probably)"
note = "Tigernach's monastery, with a steady line of abbots; its abbot Gormgal (placed at Ard Mhacha) held Armagh and Clones together by 805. No early enclosure found by excavation; the round tower, cross and churches are later; burials predate the tower. No event recorded 760-800. Constans 'the learned' of Loch Erne (d. 777) shares the abbot Fínán's death notice; he stays out (more likely of White Island)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.old_leighlin]
name = "Seanleithghlinn"
tag = "Uí Dróna of Idrone, within Uí Cheinnselaig (church of Laisrén / Mo Laise)"
note = "Laisrén's house (d. 638), a bishop-abbot seat in tradition, tied to the Roman Easter party. The '1,500 monks' has no early source (a stock saint's-life figure): not counted toward size. Nothing early excavated; an early cross and St Laserian's well survive. No event recorded 755-805. The local royal line is Cairpre son of Laidcnén's (placed already)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.scattery]
name = "Inis Cathaigh"
tag = "Corcu Baiscinn and Uí Fidgeinte (church of Senán)"
note = "Senán's island monastery in the Shannon estuary, about 0.7 km², reached only by boat, commanding the river's traffic. By tradition Senán admitted no women. In 768: timber and earth, small churches, a graveyard and a well (the round tower is 10th century). Its abbot at his death about 796 was Ólchobar, son of a king of the Uí Fidgeinte: the abbacy was in royal hands. First raid by the Norse in 816."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on a small island (r158): little farmland, some fishing. Senán's rule (no women) may be a custom of the place: for the church design."

[location.iniscealtra]
name = "Inis Cealtra"
tag = "the Munster-Connacht edge on Lough Derg (church of Colum mac Crimthainn and Caimín)"
note = "An island monastery of some 25 to 50 acres in Lough Derg, reached by boat. Caimín (d. 654), half-brother of Guaire Aidni of Connacht, is its second founder. De Paor's excavations (1970-80) found a palisaded enclosure with a timber shrine under the Saint's Graveyard (very early, rebuilt several times), imported E2 pottery and a Lindisfarne-style brooch; the stone churches and metalworking are 11th-13th century. Its learned abbot Mugthigern died in 785. No raid before the Norse (836)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on an island (r158): farmland on 25-50 acres, some fishing. The early palisade is a shrine enclosure, not the monastery's boundary."

[location.cloyne]
name = "Cluain"
tag = "Uí Liatháin, east Cork (church of Colmán mac Lénéni, the poet)"
note = "'Meadow of the cave': Colmán, a court poet before he was a cleric (d. about 604), was given the land by the Eóganacht Glendamnach king. Cloyne Cave, the largest in Cork, is said to have been his retreat (tradition). Three wide ditches found in 2023 may be the inner and outer monastic enclosures (only their later fills are dated). No one of Cloyne is named in the annals before 821; no event recorded 760-800. The Uí Liatháin king Cinaed son of Anmchad (d. 789) is a note for when the Uí Liatháin seat is researched."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (ditches that may be its inner and outer circuits: medium-low)."

[location.fore]
name = "Baile Fhobhair"
tag = "Mide (church of Féichín; patrons uncertain)"
note = "Féichín's monastery (d. 665), with bishops, learned men and close ties to Clonmacnoise (its man Fairchellach became abbot there). The '300 monks' probably counts the estate's lay tenants; '3,000' is not credible. The mill, the seven wonders and the anchorite's cell are later traditions and buildings (12th to 17th century); St Féichín's church nave is pre-12th century, in 768 probably timber. Burned 749; nothing more until 815."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.drumcliff]
name = "Droim Chliabh"
tag = "Cairpre Droma Cliab (a Columban house under Iona)"
note = "A Columban monastery under Ben Bulben, by tradition Colum Cille's. No one of Drumcliff is named before the 10th century. Enright's excavations (1980-86, never fully published) found an inner monastic enclosure with internal ditches, a metalled surface, a kiln and a possible furnace, pits with early medieval pottery and cultivation ridges. The Law of Colum Cille was proclaimed in 756 and enforced in 777. The local kings of Cairpre (Cathal mac Conaill Menn, d. 770; Cathmug, d. 791) have no seat in the scenario (a proposal)."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (excavated inner enclosure ditch: medium)."

[location.ardfert]
name = "Ard Fhearta"
tag = "Ciarraige Luachra, north Kerry (church of Brendan)"
note = "Brendan's church near his birthplace. No Ardfert person or event is recorded before the 11th century (every 8th-century 'Brendan's church' entry is Clonfert). Over 800 burials excavated (1990), undated; the enclosure cannot be traced; the cathedral and churches are 12th century and later. Later a seat of jurists and the bishops of Kerry. The Ciarraige Luachra kings (Dúnchad, d. 782; Máel Cobo, d. 796) are a note for when their seat is researched."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.ardmore]
name = "Aird Mhór"
tag = "Déisi Muman (church of Declán)"
note = "Declán's church on a ridge above Ardmore Bay, with a hermitage cell (Dísert Decláin) a mile away. The claim that Declán came before Patrick is 12th century. A D-shaped enclosure about 200 by 130 m with a bank 13-18 m wide survives (conservation plan 2022; undated). Declán's oratory (the Beannachán, a shrine-chapel) may be 8th century; ogham stones older still; the tower and cathedral are later. No Ardmore person or event is recorded before 1203."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (the surviving D-shaped bank and ditch: medium). The oratory waits for the buildings design."

[location.lusk]
name = "Lusca"
tag = "south Brega (church of Mac Cuilinn; abbots of the Ciannachta)"
note = "Mac Cuilinn's church ('vault', for the saint's tomb), a major house: a bishop and an abbot together, with a vice-abbot, scribe, steward and lector; Adomnán held a synod here (695-696, via Gwynn and Hadcock). Three nested enclosures reconstructed from street and field lines; the outer precinct about 515 by 280 m, its ditch radiocarbon-dated to 420-600. A wooden church in 768; lay tenants and kilns outside the precinct; a fair on Mac Cuilinn's feast (6 September), where Ailill, king of south Brega, was killed falling from his horse in 799. The abbacy ran in the family of Crunnmael son of Colgu (d. 736)."
proposed_kind = "monastery"
proposed_size = 3
proposed_buildings = ["church", "enclosure"]
proposed_why = "Size 2 to 3: the outer precinct (about 515 by 280 m, dated 420-600) and its many officers put it with Durrow and Clonard. Add the enclosure."

[location.swords]
name = "Sord"
tag = "Brega (church of Fínán the Leper; Columban by tradition)"
note = "Fínán the Leper's church; the Colum Cille foundation story is late (some put the foundation in the 7th century). No Swords person is named before 965; the annals first mention it in 994. The enclosure survives on the west in a townland boundary, the Ward River probably closing it; early Christian burials found. A well of Colum Cille lies south-east."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (the townland-boundary line with the river: medium)."

[location.killeany]
name = "Cill Éinne"
tag = "Aran (church of Énda; the island's rulers in 768 are unresolved)"
note = "Énda's monastery on Inis Mór, famed in later tradition as a school of saints (the pupil lists are late and unsourced). One named churchman in fifty years: Abbot Gaim Díbáil (d. 759). The round-tower stump and the stone churches are probably later than 768; no excavation of the monastery. Killeany Harbour, a sheltered bay, was probably the landing place. Who ruled Aran in 768 (Eóganacht Árann, Corco Modruad, Uí Fhiachrach Aidne) is not settled."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on an island (r158): little farmland, some fishing, boat access."

[location.mungret]
name = "Mungairit"
tag = "Uí Fidgeinte country, north Munster (church of Nessán)"
note = "Nessán's monastery, a major Munster church: its abbots die beside those of Lismore and Armagh in the annals, and Abbot Bodbgal was killed in a battle 'between the Munstermen themselves' in 757. The '1,500 monks' and 'six churches' have no early source. The standing churches are later; the core is unexcavated. First raid by the Norse in 834."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "No change."

[location.lorrha]
name = "Lothra"
tag = "Múscraige Tíre, north Munster (church of Ruadán)"
note = "Ruadán's monastery (the 'cursing of Tara' legend is a Middle Irish text). A large double-banked outer enclosure about 380 by 310 m with a D-shaped inner one; corn-drying kilns outside, one dated 545-660; a rock-cut well; high-cross fragments of the 8th-9th century. The Stowe Missal was written at Tallaght after 792 and came to Lorrha later: not here in 768. A bishop and an abbot in this period."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "enclosure"]
proposed_why = "Keep size 2; add the enclosure (the double-banked outer enclosure, undated; the kilns beside it are early). Its size (about 380 by 310 m) would argue for 3 if dated: not proposed."

[location.knockainey]
name = "Cnoc Áine"
tag = "Eóganacht Áine, one of the three lines that took turns as kings of Munster"
note = "The hill of Áine: a cairn and ring-barrows on the summit, the Áine cult and an assembly tradition (Áine is first named about 900, in Cormac's Glossary), and an undated trivallate ringfort on the slope. A battle of Áine is recorded in 667. The line's king in 768 is Cathussach mac Eterscélai, king of Munster in the king-lists (placed at Caiseal); the annals name no separate king of Áine. Carraig Aille at Lough Gur, 5 km off, is a stone fort occupied from the 7th or 8th century (a size-1 place of its own)."
proposed_kind = "ceremonial_ground"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "Kind ringfort to ceremonial ground (an assembly and burial hill, like Tara and Uisneach), with the seat mark of the Eóganacht Áine; keep size 2 and the enclosure (the trivallate ringfort, as the residence). Question: move Ólchobar mac Duib Indrecht, a prince of Áine (placed at Caiseal), here?"

[location.fahan]
name = "Fathain"
tag = "Cenél nEógain of Inishowen (church of Mura)"
note = "Mura's church, the main church of the Inishowen rulers, about 6 km from Ailech. Its carved slab carries the only early Greek inscription in Ireland (a Gloria Patri); its date runs from the 7th century to about 800, so it may not yet stand in 768. An oath-relic crozier (the Bachall Mura). Its later monk Fothad 'of the Canon' won the clergy's freedom from military service about 804. No excavation; enclosure size unknown."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church", "high_cross"]
proposed_why = "No change (the slab is kept as the high cross; its date is uncertain)."

[location.locha_lein]
name = "Loch Léin"
tag = "Eóganacht Locha Léin, Iarmumu (west Munster)"
note = "Not in the scenario. The seat of the Eóganacht Locha Léin, whose king Máel Dúin mac Áedo was the strongest king in Munster in 768 (king of Munster in the Inisfallen and Tigernach annals; of Irluachair in Ulster's). No royal residence is named or excavated. Around Lough Leane: Inisfallen, a royal church island (already a size-1 monastery); Ross Island, with copper smelting of the 7th-8th century. Proposed as a stand-in seat, like Ráth Bhoth and Dún Sobhairce."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort on the Lough Leane shore by Ross Island (about 52.04, -9.53: placement, not a found site), with the seat mark of the Eóganacht Locha Léin."

[location.ui_maine_seat]
name = "Dún Imghain"
tag = "Uí Maine, south-east Connacht"
note = "Not in the scenario. No 8th-century Uí Maine royal seat is identified; every source naming their sites is about 1400 (the Book of Lecan tract). Its sites: Cluain Tuaiscirt (where the later O'Kellys were inaugurated, a church), Dún Imghain (Dunamon, on the Suck, the one fortified place it names), Clonfert. The Uí Maine fought the Uí Briúin (beaten at Achad Liac 774 and Mag Dairben 777); their kin held Clonmacnoise (Rechtnia, abbot, already placed)."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort at Dún Imghain (Dunamon, on the Suck; coordinates to check), with the seat mark of the Uí Maine."

[location.tailtiu]
name = "Tailtiu"
tag = "Brega, the Uí Néill assembly (Óenach Tailten)"
note = "Not in the scenario. Teltown: the great assembly and fair of the Uí Néill, held by the king of Tara. Ráith Airthir, a triple-ringed enclosure at least 80 m across with a barrow at its centre, opposite Donaghpatrick church (about 53.698, -6.760), is its assembly place: there Donnchad Midi (placed at Mide) dishonoured the staff of Jesus and Patrick's relics at the fair in 789. No one lives there."
proposed_kind = "ceremonial_ground"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "New location: a ceremonial ground at Ráith Airthir, Teltown (53.698, -6.760). No figures; it hosts the Óenach Tailten."

[location.tir_amalgaid]
name = "Tír Amalgaid"
tag = "Uí Fiachrach Muaidhe, north Connacht (the Moy and Tirawley)"
note = "Not in the scenario. The family seat of the Uí Fiachrach Muaidhe, whose Donn Cothaid is king of Connacht in 768 (placed at Ráth Cruachan, the provincial seat). No residence is known. Their attested royal place is Carn Amalgaid, an inauguration cairn and enclosure just north of Killala (about 24 m inside, 74 m outside in the 1830s; nearly levelled by 1911; position uncertain within about 2 km). Rivals of the Uí Briúin: Ailill won at Druim Róbaig (758); they slaughtered the Uí Briúin of Umall (787). Killala (Cill Ala) is their church."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort near Killala (about 54.20, -9.23: placement, not a found site), with the seat mark of the Uí Fiachrach Muaidhe. Connmach son of Donn Cothaid lives here (r171); Donn Cothaid stays at Ráth Cruachan as king of Connacht."

[location.moynagh]
name = "Maigh nEach"
tag = "the Mugdorna (Mugdorna Breg), an Airgíalla people"
note = "Moynagh Lough crannog, Nobber: 'the royal site of the Mugdorna' (Gleeson, citing Bradley; one source). Bradley's excavations: palisade timbers felled in 748, occupation through the 8th century, metalworking areas and round houses. The Mugdorna then spanned south Monaghan to Meath; the split into Mugdorna Maigen and Mugdorna Breg came about 785-793. Their church Donaghmoyne has only a Norman motte. Aengus son of Ailéne is the likeliest king in 768 (the only king recorded 759-786)."
proposed_kind = "crannog"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "Keep crannog 1; raise confidence to medium; add the seat mark of the Mugdorna. The Mugdorna figures live here (r171)."

[location.rathmore]
name = "An Ráth Mhór"
tag = "Dál nAraidi (the Cruithin of north-east Ulster; Uí Chóelbad)"
note = "Ráth Mór Maige Line, the 'great fort' of Moylinny by Antrim town, held in tradition as the Dál nAraidi royal seat; the annals name it only for a battle against the Britons (682). No excavation report could be found (the scenario's 'Lynn excavations' source is unverified), so its size and 8th-century occupation are unknown. In 768 the Ulaid kingship is held by the Dál Fiatach (Fiachnae, at Dún Pádraig); the Dál nAraidi fight among themselves (Drong, 776; Duma Achad, 783) until Tomaltach takes the Ulaid kingship (789-790)."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "Size 1 to 2: the seat of one of the two great Ulaid peoples. Its source line should drop the unverified 'Lynn's Rathmore excavations'."

[location.dunseverick]
name = "Dún Sobhairce"
tag = "Dál Riata's Irish lands, north Antrim (stand-in seat for Dunadd)"
note = "A coastal promontory fort on a rock with sea on three sides, a bank and ditch across the landward neck; Dál Riata occupation from about the 7th century (National Trust). Unexcavated; a cave below gave early medieval pottery. The northern end of the Slige Midluachra, one of the five roads from Tara in tradition. Stormed 'for the first time' in 871; sacked by Norse in 926. The Dál Riata kings ruled from Argyll; who held north Antrim in 768 is not recorded."
proposed_kind = "promontory_fort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "Kind ringfort to promontory fort (a sea-girt headland fort). Keep size 1 and the stand-in seat for Dál Riata."

[location.carraig_aille]
name = "Carraig Aille"
tag = "Lough Gur, under the Eóganacht Áine (or the Uí Fidgeinte)"
note = "Two stone forts on one hill at Lough Gur, 42 and 47 m across, walls 3-4 m thick, about 5 km from Cnoc Áine. Fort II is the richer: steps to the wall-walk, a cobbled cattle entrance, round houses then buildings against the rampart; finds of combs, querns, jet, amber and glass beads. Occupied from the 7th or 8th century to the 10th or 11th: probably lived in in 768. The Viking-age silver hoard in its wall is later. Beside it: the Spectacles field system, the Bolin Island crannog. No lord is named."
proposed_kind = "cashel"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "Kind ringfort to cashel (stone forts), size 1 to 2 (a pair of forts, Fort II high-status)."

[location.cahercommaun]
name = "Cathair Chomáin"
tag = "the Burren (built later)"
note = "Removed from the 768 start (owner r172): the triple-walled cliff fort is dated to the 9th-10th century (Cotter 1999; Hencken 1938: early 9th), with no radiocarbon dates; a chiefdom centre for cattle tribute (97% of its animal bone is cattle), 40-50 people. Logged as a place built later."
proposed_kind = "removed"
proposed_size = 0
proposed_buildings = []
proposed_why = "Removed from the 768 start; logged as built later (r172)."

[location.corco_modruad]
name = "Corco Modruad"
tag = "Corcu Modruad, the Burren (north Clare)"
note = "Not in the scenario. A stand-in seat for the Corcu Modruad, the people of the Burren and Corcomroe, whose king in 768 is Torpaid (d. 769, the Annals of Inisfallen), the only king of theirs named between 744 and the 870s. No seat of theirs is known; the Déisi destroyed them in 744 (AU). Placed in the north Burren lowland near Corcomroe, which is named after them."
proposed_kind = "ringfort"
proposed_size = 1
proposed_buildings = ["enclosure"]
proposed_why = "New location: a stand-in royal ringfort near Corcomroe (about 53.10, -9.07: placement, not a found site), with the seat mark of the Corcu Modruad (r172)."

[location.bruree]
name = "Brú Rí"
tag = "Uí Fidgeinte, north Munster (on the Maigue)"
note = "The seat of the Uí Fidgeinte, a Munster people who in later tradition stood as equals of the Eóganacht; with the Araid Cliach they defeated a Máel Dúin son of Áed in Brega in 766. The 'Bruree Forts' are a group of enclosures 25-50 m across, one with three concentric banks (Liss Olium in Lotteragh, folklore form); none excavated or dated. Brú Rí is not named in the annals of this period (an early name may be Dún Eochair Maige). Their king in 768 is probably Cenn Fáelad (d. 774); Flann mac Erca's sons follow."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "Size 1 to 2: the seat of a regional kingdom, a group of forts."

[location.rathangan]
name = "Ráth Iomgháin"
tag = "Uí Failge, west Leinster"
note = "A bivallate royal platform ringfort on high ground at the west end of Rathangan, about 55 m across (OS letters, 1837), with a great deep ditch; an early poem names it as the burial place of the local kings. It is first named as a royal place in AU 806, when King Flaithnia son of Cináed was killed inside it. Unexcavated. The Uí Failge lost two kings in 755-757; in 768 they are ruled by Cináed son of Flann, under the Uí Dúnlainge kings of Leinster, whom they fight (Áth Orc, 770)."
proposed_kind = "ringfort"
proposed_size = 2
proposed_buildings = ["enclosure"]
proposed_why = "Size 1 to 2: a large bivallate royal ringfort of a regional kingdom."

[location.inisfallen]
name = "Inis Faithlinn"
tag = "Eóganacht Locha Léin (a royal church island, by type)"
note = "An island monastery of about 8.5 ha in Lough Leane, by tradition founded about 640 by a Fínán. Called a 'royal church island' of the Loch Léin kings (Breathnach), a royal cemetery by type, unexcavated. Its early buildings were wooden; the standing churches are 10th-12th century. No one of Inisfallen is named before 1075. The Annals of Inisfallen were written at Emly and elsewhere and reached the island only about 1130-1159."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on an island (r158): farmland on 8.5 ha, some fishing, boat access; beside the Loch Léin seat."

[location.slane]
name = "Baile Shláine"
tag = "Brega (church of Erc; the Síl nÁedo Sláine country)"
note = "Erc's church on the Hill of Slane (Muirchú, about 700: Erc rose for Patrick at Tara; his relics 'are worshipped in the city called Slane'; the Easter-fire hill link is later). A major Brega church: its abbots held Cell Fhoibrich, and Fedach (placed at Lú) held Louth, Slane and Duleek together; Erc's relics went on circuit in 776. The abbacy ran in two families (the sons of Maenach, the sons of Cormac). An undated circular enclosure about 120 m across surrounds the later motte; the friary is 16th century."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "Size 1 to 2: a major Brega church with a relic circuit and multiple houses; the 120 m enclosure is undated, so not added."

[location.trim]
name = "Baile Átha Troim"
tag = "Cenél Lóegairi, under the southern Uí Néill (church of Lommán)"
note = "Lommán's church at the ford of Trim. The Book of Armagh (about 700) tells how Fedelmid son of Lóegaire gave the land, and makes Lommán a Briton and Patrick's nephew, binding Trim to Armagh. The chief church of the Cenél Lóegairi; a bishop and an abbot; burned in 784. Six early burials under the cathedral (one dated 430-640) and a large undated ditch; no 8th-century church found. The Cenél Lóegairi kings (Mael Dúin, d. 784; Cú Raí, d. 797) have no seat of their own."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
proposed_why = "Size 1 to 2: the chief church of a small kingdom, with a bishop, abbot and scribes."

[location.clondalkin]
name = "Cluain Dolcáin"
tag = "Uí Dúnchada country, by the Leinster king's seat at Liamhain (church of Crónán Mochua)"
note = "Mochua's monastery, with a bishop and an abbot in this period. Its enclosure (about 310 m, from the street plan) is untested (the one excavation found no ditch); the round tower is later than 768. Plundered by the Norse in 833; a Norse fort here burned in 867. The 'relics translated in 789' story is probably a garbled record of Bishop Fer Fugaill's death that year."
proposed_kind = "monastery"
proposed_size = 2
proposed_buildings = ["church"]
