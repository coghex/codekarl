note = "Diarmait the Just's island monastery (6th century, by tradition), about 58 ha. A D-shaped cashel about 180 by 145 m holds four churches, a fifth stands outside and a sixth (Clogas) on the hilltop; none is dated (two Romanesque jambs are 12th century). Its abbacy was shared with Fochlaid in Mide: Echaid son of Fócartach held both at his death in 785. Sínach of Inis Clothrann died in 720. First Norse attack on Lough Ree 843."
