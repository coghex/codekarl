[location.dromore]
name = "Droim Mór"
tag = "Uí Echach Cobo, Iveagh (church of Colmán)"
note = "Colmán's monastery (6th century), probably the chief church of the Uí Echach Cobo (its diocese matches Iveagh). No abbot or event is recorded before 842. No enclosure shown (the 2009 dig found only a 19th-century holy well); the high cross is 9th-10th century and the motte Norman."
