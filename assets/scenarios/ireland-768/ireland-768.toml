[location.skellig_michael]
name = "Sceilg Mhichíl"
tag = "Corcu Duibne country, off the Kerry coast (a hermit monastery)"
note = "A hermit monastery on a bare sea rock: six beehive cells and two oratories, the earliest provisionally 8th century (one oratory late 7th to early 9th); about a dozen monks by the cell count. Barley and oats grown on terraces with seaweed, seabirds, eggs, fish and seals; water from rock-cut cisterns; wood and grain from the mainland. The South Peak hermitage is 9th century, the church later. No one is named here before Étgal, taken by the Norse in 824."
proposed_kind = "monastery"
proposed_size = 1
proposed_buildings = ["church"]
proposed_why = "No change. A monastery on a bare rock island (r158): almost no farmland; fishing and seabirds; boat access; it depends on the mainland."

[location.inishbofin]
name = "Inis Bó Finne"
tag = "off the Galway coast (Colmán's Irish community)"
note = "The island where Colmán of Lindisfarne settled after Whitby (668), leaving the Irish monks here when he moved the English to Mayo (Bede). A bishop (d. 713) and an anchorite (d. 736) are recorded; the 768 abbot is not. About 12 km² with a sheltered harbour, 8 km off Cleggan; the church ruin is 14th century, with early cross-slabs and a possible enclosure scarp. Plundered with Inishmurray in 795 (AI, reading uncertain: three islands share the name)."
proposed_kind = "monastery"
