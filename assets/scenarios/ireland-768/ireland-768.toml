[location.killala]
name = "Cill Ala"
tag = "Uí Fiachrach Muaidhe (a Patrician church in tradition)"
note = "The church of the Uí Fiachrach Muaidhe, by their seat Tír Amalgaid and Carn Amalgaid. Its Bishop Muiredach story is from the 9th-century Tripartite Life (Tírechán names Mucnae's church in the Wood of Fochloth instead). No one of Killala is named in the annals; the round tower is 12th century; digs found nothing early."
