note = "Kilclispeen at Ahenny: two famous carved high crosses, dated 8th century (Henry) or mid-9th (Harbison), with no recorded monastery, abbot or annal entry; the standing church wall is later medieval. Its king is Tóim Snáma of Osraige (placed at Belach Gabráin)."
