[location.ardagh]
name = "Ardachadh"
tag = "South Tethbae, Cenél Maini (church of Mél)"
note = "Mél's church (d. 487), the mother church of South Tethbae. De Paor's dig (1967) found the single-cell stone church built over a timber church of almost the same plan (the timber phase tentatively 8th century), and a triple-ringed ringfort with iron-working beside it. No bishop or abbot is named between 760 and 800. The Patrick's-nephew and Brigit stories are later."
