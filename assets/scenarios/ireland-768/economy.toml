# --- CK-359: the noble houses at 768 (copy of scenario/p1-nobles-start-r1.toml, sha256 8c50f823..., see SOURCES.md) ---
# P1 start data: noble pops at 768 (ck-designer-1, 2026-11-19; owner r188 for the sizes, the rest designer).
# One noble pop per place where a royal house lives (every place with a living noble figure in figures/ireland-768.toml; the
# seats of locations-changes-r3). One pop per place for now: houses split pops when characters arrive (households-r4).
# people: by the seat's size, 20 / 40 / 80 (size 1-3); a seat in a church settlement takes the court's own size, not the church's.
# demesne_levels: noble-owned demesne (p1-noble-economy-r1; 1 per 20 nobles), each worked by 10 labourers (a labourer pop of the place's culture),
# one noble owner covering 10 labourers as at the monasteries. Living space owned: the demesne's housing (rent-r1).
# dal_riatan: Dún Sobhairce is the Dál Riata stand-in seat but the place's culture is ulaid; the noble pop is dal_riatan.

[nobles.aidne_seat]
# Dúrlas Guaire (ringfort 1); 3 living noble figure(s)
culture="connachta"
religion="christianity"
people=20
demesne_levels=1
labourers=10

[nobles.ailech]
# Grianán Ailigh (cashel 3); 8 living noble figure(s)
culture="northern_ui_neill"
religion="christianity"
