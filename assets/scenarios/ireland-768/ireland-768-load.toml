# Ireland 768: the structured fields the loader reads (r3; r3: household women and Cashel's court cleric in the noble pop at royal
# sites. r2: r2 2026-11-20 for CK-370 review: structured dates, alive_at_start, pop_kind,
# dead parents' birth and seat, monastery slot members in the monk pop, Monasterboice's abbot). Drafted by Claude (ck-designer-1), 2026-11-20, for characters slice 8.
# Companion to figures/ireland-768.toml (the research record: names, dates, roles, languages, notes, beats). This file adds, keyed by
# figure key: house and subhouse (households-r4; subhouses are L7 data, stored now), house of birth where it differs, the office
# marker (ruler / high_cleric; heir is the succession law's, L1), parent and spouse keys, the dead fathers the figures name, the known
# relationships as strands, and the generated slots as structured members. Houses are group keys; display names come with L7.
# Rulers: the 31 kings and heads of royal kin in office at 9 October 768. high_cleric: bishops, and abbots or abbesses of churches of
# size 2 or more (size-math-r3). Notes: .pipeline/coordination/history-scratch/figures-load-r1.md.

# pop_kind: the pop the figure joins at its location: "noble" = the place's noble pop (p1-nobles-start; Dún Sobhairce's is dal_riatan),
# "monk" = the place's monk pop (Mayo's is northumbrian). born / died: years (estimated where flagged); died_date where the day is known;
# died_before_start: died before 768, year unknown. alive_at_start: false for the six who died in 768 before 9 October (archived).

