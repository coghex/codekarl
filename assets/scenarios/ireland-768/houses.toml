# House display names (r1). Drafted by Claude (ck-designer-1), 2026-11-21, for characters slice 9 (the character UI).
# Every house and subhouse key in ireland-768-load.toml, with the name shown and the dynasty shown before the dot where there is one
# ("Uí Néill · Cenél nEógain"). Forms are the standard Old Irish spellings historians use (Byrne, Irish Kings and High-Kings;
# Charles-Edwards, Early Christian Ireland). Dynasty groupings are the usual ones; a house with no dynasty shows its name alone.
# Subhouses are L7 data: their names are here for later, the card does not show them yet.
#
# Generated minor houses (key <father>_<place>) are not listed: the name is made from the founder, the father whose name the key
# carries. Gaelic cultures: "Clann <founder's genitive>" (names.toml genitive; no lenition, TUNE); other cultures: "house of <name>".

