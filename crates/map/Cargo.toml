[package]
name = "ck-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
png = { version = "0.18", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[features]
# The slice 6 map fixture (`ck_map::fixture`), which the Metal and Vulkan readback tests compare the map pass with. Off by default:
# only dev-dependencies of the tests that compare enable it.
test-support = []

[dev-dependencies]
ck-map = { path = ".", features = ["test-support"] }

[lints]
workspace = true
